<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Два квадрата</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100E1A; --surf:#1B1830; --surf2:#232041; --line:#2E2A4D;
  --text:#F3F0FF; --dim:#9C97BC;
  --you:#7B61FF; --foe:#FF7A59; --good:#38D9A9; --bad:#FF5470;
  --rad:20px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#F3F1FA;--surf:#FFFFFF;--surf2:#F7F5FF;--line:#E2DEF3;--text:#1A1730;--dim:#6B6690;--you:#5B3DF5;--foe:#E24F26}
}
/* в Telegram тему задаёт клиент, а не система: светлый Telegram на тёмной ОС должен быть светлым */
:root[data-theme="light"]{--bg:#F3F1FA;--surf:#FFFFFF;--surf2:#F7F5FF;--line:#E2DEF3;--text:#1A1730;--dim:#6B6690;--you:#5B3DF5;--foe:#E24F26}
*{box-sizing:border-box}
html,body{height:var(--app-h,100%)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Onest,system-ui,sans-serif;
  font-size:15px;line-height:1.4;overflow:hidden;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--you);outline-offset:2px}
.app{height:100%;max-width:520px;margin:0 auto;padding:10px 12px 12px;
  display:grid;grid-template-rows:repeat(6,auto) minmax(0,1fr);gap:10px;overflow:auto}

/* HUD */
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who{background:var(--surf);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;
  border:1.5px solid transparent;transition:border-color .2s}
.who.acting{border-color:var(--you)}
#hud1.acting{border-color:var(--foe)}
.who .name{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.who .name::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--you)}
#hud1 .name::before{background:var(--foe)}
.who{position:relative}
.who .val{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.valrow{display:flex;align-items:center;gap:10px;min-height:32px}
.dslot{position:relative;flex:1;height:30px}
.delta{position:absolute;left:0;top:50%;font-size:20px;font-weight:800;pointer-events:none;white-space:nowrap;
  padding:1px 10px;border-radius:999px;animation:floatup 1.7s cubic-bezier(.25,.9,.35,1) forwards}
.delta.plus{background:color-mix(in srgb,#38D9A9 20%,transparent)}
.delta.minus{background:color-mix(in srgb,var(--bad) 20%,transparent)}
.delta.plus,.hit.plus{color:#38D9A9}
.delta.minus,.hit.minus{color:var(--bad)}
.hit{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:30px;font-weight:800;
  letter-spacing:-.02em;pointer-events:none;z-index:4;animation:hitup 1.8s cubic-bezier(.2,.9,.3,1) forwards;
  padding:2px 12px;border-radius:999px;background:var(--surf);box-shadow:0 6px 20px rgba(0,0,0,.45)}
.hit.plus{background:color-mix(in srgb,#38D9A9 22%,var(--surf));box-shadow:0 0 0 2px color-mix(in srgb,#38D9A9 45%,transparent),0 6px 20px rgba(0,0,0,.4)}
.hit.minus{background:color-mix(in srgb,var(--bad) 22%,var(--surf));box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 45%,transparent),0 6px 20px rgba(0,0,0,.4)}
.cell.flash-plus{animation:flashp .7s ease-out}
.cell.flash-minus{animation:flashm .7s ease-out}
@keyframes flashp{0%{background:color-mix(in srgb,#38D9A9 28%,var(--surf2))}100%{background:var(--surf2)}}
@keyframes flashm{0%{background:color-mix(in srgb,var(--bad) 28%,var(--surf2))}100%{background:var(--surf2)}}
@keyframes floatup{0%{opacity:0;transform:translate(-8px,-50%) scale(.7)}
  14%{opacity:1;transform:translate(0,-50%) scale(1.25)}
  28%{transform:translate(0,-50%) scale(1)}
  70%{opacity:1;transform:translate(0,-50%)}
  100%{opacity:0;transform:translate(6px,-90%)}}
@keyframes hitup{0%{opacity:0;transform:translate(-50%,14px) scale(.6)}
  12%{opacity:1;transform:translate(-50%,-4px) scale(1.35)}
  24%{transform:translate(-50%,0) scale(1)}
  60%{opacity:1;transform:translate(-50%,-16px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-52px) scale(.95)}}
.who .sub{font-size:11.5px;color:var(--dim)}
.who.away .sub{color:var(--text);opacity:.75}
.who.tired .sub{color:#FFC53D;opacity:1}
.capbar{display:block;height:4px;border-radius:999px;background:var(--surf2);margin-top:6px;overflow:hidden}
.capbar i{display:block;height:100%;background:var(--you);transition:width .3s}
#hud1 .capbar i{background:var(--foe)}
.capv{font-size:10.5px;color:var(--dim);margin-top:2px}

.status{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim);flex-wrap:wrap}
.pill{background:var(--surf);border-radius:999px;padding:5px 11px;font-size:12px}
.pill.hot{background:color-mix(in srgb,var(--bad) 18%,var(--surf));color:var(--bad)}
.pill b{font-weight:700;color:var(--text)}
.pill.hot b{color:var(--bad)}
.pill.menu{margin-left:auto;color:var(--text);border:1px solid var(--line)}
button.pill{cursor:pointer;border:1px solid var(--line)}
.note{margin:0;font-size:12.5px;color:var(--dim);background:var(--surf);border-radius:12px;padding:10px 12px;line-height:1.4}
.note[hidden]{display:none}

/* сцена */
.stage{background:var(--surf);border-radius:var(--rad);padding:14px 12px;display:flex;
  align-items:center;justify-content:center;gap:12px}
.cellwrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cellttl{font-size:12px;color:var(--dim);text-align:center}
.cell{position:relative;background:var(--surf2);border-radius:16px;height:92px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;padding:10px;border:1.5px dashed var(--line)}
.cell.mine{border-style:solid;border-color:color-mix(in srgb,var(--you) 45%,transparent)}
.cell.foes{border-style:solid;border-color:color-mix(in srgb,var(--foe) 45%,transparent)}
.rentlab{font-size:11.5px;color:var(--dim);text-align:center}
.rentlab b{display:block;font-size:17px;font-weight:700;color:var(--text)}
.rentlab b u{text-decoration:none;font-size:11px;font-weight:600;color:var(--bad);margin-left:4px}
/* пометка вне потока: иначе доска прыгает каждый раз, когда соперник щёлкает Арендой */
.rentlab b{position:relative}
.rentlab b i{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;
  font-style:normal;font-size:11px;line-height:1.2;font-weight:600;color:var(--good)}
.rentlab.bump b{animation:bump 1.1s cubic-bezier(.25,1.2,.4,1)}
@keyframes bump{0%{transform:scale(1)}18%{transform:scale(1.45);color:var(--bad)}45%{transform:scale(1);color:var(--bad)}100%{transform:scale(1)}}
.pawn{font-size:12.5px;font-weight:600;border-radius:999px;color:#fff;
  width:64px;height:28px;display:grid;place-items:center}
.pawn.a{background:var(--you)}.pawn.b{background:var(--foe)}
.pawn.guest{outline:2px dashed color-mix(in srgb,var(--text) 55%,transparent);outline-offset:2px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.coinwrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.coin{width:64px;height:64px;border-radius:50%;background:var(--surf2);display:grid;place-items:center;
  font-size:28px;font-weight:800;border:2px solid var(--line);transition:transform .25s}
.coin.flip{animation:spin .4s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.coinlab{font-size:11px;color:var(--dim);transition:color .2s}
.coinlab.live{font-weight:600}
.coinlab.live.go{color:var(--you)}
.coinlab.live.stay{color:var(--dim)}

/* сообщение и кнопка */
.toks{display:flex;gap:6px}
.tk{flex:1;background:var(--surf);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;
  align-items:center;gap:1px;font-size:11px;color:var(--dim);border:1.5px solid transparent;line-height:1.2}
.tk b{font-size:13px;font-weight:600;color:var(--text)}
.tk i{font-style:normal;font-size:11px}
.tk.can{border-color:var(--you)}
.tk.can i{color:var(--you);font-weight:600}
.tk:disabled{opacity:.45;cursor:default}
.msg{margin:0;font-size:13.5px;color:var(--dim);text-align:center;min-height:2.4em;display:grid;place-items:center;padding:0 4px}
.acts{display:flex;gap:8px}
.btn{flex:1;background:var(--you);color:#fff;border-radius:16px;padding:14px;font-weight:600;font-size:16px;
  transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surf);color:var(--text)}
.btn:disabled{opacity:.4;cursor:default}

/* нижний лист */
.sheet{background:var(--surf);border-radius:var(--rad);display:flex;flex-direction:column;min-height:120px}
.tabs{display:flex;gap:4px;padding:8px 8px 0}
.tab{flex:1;padding:8px;border-radius:12px;font-size:13px;color:var(--dim);font-weight:500}
.tab[aria-selected="true"]{background:var(--surf2);color:var(--text)}
.pane{overflow:auto;padding:8px 10px 12px;min-height:0}
.pane[hidden]{display:none}

.perks{display:flex;flex-direction:column;gap:6px}
.card{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto auto;gap:1px 10px;
  background:var(--surf2);border-radius:14px;padding:10px 12px;text-align:left;
  border:1.5px solid transparent;transition:border-color .15s,transform .12s}
.card.ready{border-color:color-mix(in srgb,var(--you) 40%,transparent)}
.card.ready:active{transform:scale(.99)}
.card.shut{opacity:.5}
/* перк, закрытый драфтом, не должен сливаться с «ещё не открытыми»: те откроются, этот нет */
.card.banned{opacity:1;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surf2))}
.card.banned .nm{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.card.banned .buy{color:var(--bad)}
.foeperks li.banned b{color:var(--bad);text-decoration:line-through}
.foeperks li.banned i{color:var(--bad)}
.foeperks li.paused b{opacity:.55}
.foeperks li.paused i{color:var(--good);font-weight:600}
.shop{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.shop>span{font-size:11.5px;color:var(--dim)}
.card .ring{grid-row:1/4;align-self:center}
.card .nm{font-weight:600;font-size:14.5px}
.card .ef{font-size:12px;color:var(--dim);grid-column:2}
.card .nm{grid-column:2}
.card .buy{grid-column:2;font-size:12px;color:var(--you);font-weight:600;margin-top:1px}
.card .tag{grid-column:3;grid-row:1/4;align-self:center;display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-width:58px;padding:7px 10px;border-radius:12px;background:var(--surf);line-height:1.15}
.card.ready .tag{background:color-mix(in srgb,var(--you) 22%,var(--surf))}
.card .tag i{font-style:normal;font-size:10px;color:var(--dim)}
.card .tag b{font-size:16px;font-weight:700}
.card .tag u{font-size:9.5px;text-decoration:none;color:var(--dim)}
.card .q{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;margin-left:6px;
  background:var(--surf);color:var(--dim);font-size:11px;font-weight:700;vertical-align:1px;cursor:help}
.card .q:hover{color:var(--text)}
.card[aria-disabled="true"]{cursor:default}
.card[aria-disabled="true"] .tag b{color:var(--dim)}
.card .side{grid-column:3;grid-row:1/4;align-self:center;display:flex;flex-direction:column;align-items:stretch;gap:6px}
.card .side .tag{grid-column:auto;grid-row:auto}
.card .tog{text-align:center;white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--dim);
  padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);cursor:pointer}
.card .tog:hover{color:var(--text);border-color:var(--dim)}
.card .tog.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 55%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
.card .tog.off{opacity:.4;cursor:default}
.card.paused{border-style:dashed;border-color:var(--line)}
.card.paused .nm,.card.paused .ring{opacity:.55}
.card .howto{grid-column:1/4;font-size:12px;color:var(--dim);margin-top:6px;padding-top:6px;
  border-top:1px solid var(--surf);line-height:1.4}
.card.ready .tag b{color:var(--you)}
.card:disabled .buy{color:var(--dim);font-weight:400}
.ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--c) var(--p),var(--line) 0)}
.ring.a{--c:var(--you)}.ring.b{--c:var(--foe)}
.ring b{width:30px;height:30px;border-radius:50%;background:var(--surf);display:grid;place-items:center;
  font-size:14px;font-weight:700}
.foeperks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.foeperks li{display:flex;align-items:center;gap:10px}
.foeperks span{display:flex;flex-direction:column}
.foeperks b{font-size:14px;font-weight:600}
.foeperks i{font-size:12px;color:var(--dim);font-style:normal}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--dim)}
.log .fresh{color:var(--text)}
/* цвет фишки, подмешанный к цвету текста: в тёмной теме почти чистый, в светлой темнеет —
   иначе жёлтое и лаймовое имя на белом фоне не читается */
.log .pn{font-weight:700;--pnmix:82%}
:root[data-theme="light"] .log .pn{--pnmix:55%}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .log .pn{--pnmix:55%}}
.log .pn.a{color:color-mix(in srgb,var(--you) var(--pnmix),var(--text))}
.log .pn.b{color:color-mix(in srgb,var(--foe) var(--pnmix),var(--text))}
.rules{font-size:13px;color:var(--dim);line-height:1.45}
.rules h3{font-size:13px;font-weight:700;color:var(--text);margin:14px 0 4px}
.rules h3:first-child{margin-top:2px}
.rules p{margin:0 0 4px}
.rules ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.rules li::marker{color:var(--you)}
.rules b{color:var(--text);font-weight:600}
.rules .mut{margin-top:5px;font-size:12px}

.overlay{position:fixed;inset:0;background:rgba(10,8,20,.7);display:grid;place-items:center;padding:20px;z-index:9}
.overlay[hidden]{display:none}
.panelbox{background:var(--surf);border-radius:24px;padding:24px;width:min(400px,100%);
  display:flex;flex-direction:column;gap:12px;text-align:center}
.panelbox h2{font-size:26px;font-weight:800;margin:0}
.setup{display:flex;flex-direction:column;gap:14px;text-align:left}
.field>span{font-size:12.5px;color:var(--dim);display:block;margin-bottom:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:2.5px solid transparent;transition:transform .12s}
.sw.on{border-color:var(--text);transform:scale(1.06)}
/* занятый цвет остаётся узнаваемым, но зачёркнут: полупрозрачный жёлтый на тёмном выглядел бы бурым, «новым» цветом */
.sw:disabled{opacity:.45;cursor:not-allowed;background-image:linear-gradient(45deg,transparent 44%,var(--bg) 44% 56%,transparent 56%)}
.opts{display:flex;gap:6px}
.opt{flex:1;background:var(--surf2);border-radius:14px;padding:9px 6px;font-size:11px;color:var(--dim);
  display:flex;flex-direction:column;gap:2px;line-height:1.25;border:1.5px solid transparent}
.opt b{font-size:14px;font-weight:700;color:var(--text)}
.opt.on{border-color:var(--you)}
.panelbox p{margin:0;color:var(--dim);font-size:14px}
.stats{display:flex;flex-direction:column;gap:2px;text-align:left}
.srow{display:grid;grid-template-columns:1fr 62px 62px;gap:6px;align-items:center;
  font-size:13px;color:var(--dim);padding:5px 2px;border-bottom:1px solid var(--surf2)}
.srow b{text-align:right;color:var(--text);font-weight:600}
.srow.head{color:var(--dim);border-bottom-color:var(--line)}
.srow.head b{color:var(--dim);font-weight:500}
@media (max-height:700px){.cell{height:74px}.coin{width:54px;height:54px;font-size:24px}.who .val{font-size:22px}.stage{padding:10px}}
@media (prefers-reduced-motion:reduce){.coin.flip{animation:none}.pawn{animation:none}.delta{animation:fadeonly 1.7s linear forwards}}
@keyframes fadeonly{0%,80%{opacity:1;transform:translateY(-50%)}100%{opacity:0;transform:translateY(-50%)}}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="who" id="hud0"><span class="name" id="nm0">Вы</span><span class="valrow"><span class="val" id="money0">0</span><span class="dslot" id="dslot0"></span></span><span class="sub" id="sub0"></span><span class="capbar"><i id="cap0"></i></span><span class="capv" id="capv0"></span></div>
    <div class="who" id="hud1"><span class="name" id="nm1">Соперник</span><span class="valrow"><span class="val" id="money1">0</span><span class="dslot" id="dslot1"></span></span><span class="sub" id="sub1"></span><span class="capbar"><i id="cap1"></i></span><span class="capv" id="capv1"></span></div>
  </div>

  <div class="status">
    <span class="pill">круг <b id="round">1</b></span>
    <button class="pill" id="infl" title="Что такое инфляция">+0%</button>
    <span>рост ренты через <b id="inflnext">8</b></span>
    <button class="pill" id="speedBtn" title="Темп анимации: на правила не влияет">темп</button>
    <button class="pill menu" id="menuBtn">Меню</button>
  </div>

  <p class="note" id="inflNote" hidden></p>

  <div class="stage">
    <div class="cellwrap">
      <span class="cellttl" id="ttlA">ваша клетка</span>
      <div class="cell mine" id="cellA"></div>
      <span class="rentlab">рента с гостя<b id="rentA">0</b></span>
    </div>
    <div class="coinwrap"><div class="coin" id="coin">—</div><span class="coinlab" id="note">монетка</span></div>
    <div class="cellwrap">
      <span class="cellttl" id="ttlB">клетка соперника</span>
      <div class="cell foes" id="cellB"></div>
      <span class="rentlab">рента с гостя<b id="rentB">0</b></span>
    </div>
  </div>

  <div class="toks" id="toks"></div>
  <p class="msg" id="msg"></p>
  <div class="acts" id="acts"></div>

  <div class="sheet">
    <div class="tabs">
      <button class="tab" data-tab="perks">Перки</button>
      <button class="tab" data-tab="foe">Бот</button>
      <button class="tab" data-tab="log">Лог</button>
      <button class="tab" data-tab="rules">Правила</button>
    </div>
    <div class="pane" data-tab="perks"><div class="perks" id="perks"></div></div>
    <div class="pane" data-tab="foe" hidden><ul class="foeperks" id="foeperks"></ul></div>
    <div class="pane" data-tab="log" hidden><ul class="log" id="log"></ul></div>
    <div class="pane" data-tab="rules" hidden><div class="rules" id="rules"></div></div>
  </div>
</div>
<div class="overlay" id="ov" hidden><div class="panelbox" id="panel"></div></div>
<script>
const MAXLV=10, BASE_SALARY=60;
/* Доля ренты, которая достаётся владельцу; остальное сгорает. Балансовый рычаг:
   чем меньше, тем хуже Аренда как источник дохода и тем безопаснее её игнорировать. */
let RENT_KEEP=.5;
const COLORS=[['#7B61FF','фиолетовый',258],['#38D9A9','мятный',165],['#4CC9F0','голубой',195],['#FF5470','малиновый',348],['#FFC53D','жёлтый',43],['#B5E853','лаймовый',82]];
const hueOf=c=>(COLORS.find(x=>x[0]===c)||COLORS[0])[2];
function foeColor(from){
  const h=hueOf(from||cfg.color);
  let best=COLORS[0],bd=-1;
  COLORS.forEach(([c,n,ch])=>{const d=Math.min(Math.abs(ch-h),360-Math.abs(ch-h));if(d>bd){bd=d;best=[c,n,ch]}});

function buy(p,k){
  if(!PK.includes(k)||!atHome(p)||!open(p,k)||p.built)return;
  const c=cost(p,k);if(c===null||p.money<c)return;
  p.money-=c;p.lv[k]++;p.built=true;p.st.bought++;
  log(`${p.name}: ${perk(k).n} до ${p.lv[k]} уровня за ${c}, ${perk(k).fmt(p.lv[k])}`);
}
function autoSell(p){
  const owned=PK.filter(k=>p.lv[k]>0);
  if(!owned.length)return false;
  owned.sort((a,b)=>perk(b).cost[p.lv[b]-1]-perk(a).cost[p.lv[a]-1]);
  const k=owned[0];p.lv[k]--;const back=Math.round(perk(k).cost[p.lv[k]]/2);p.money+=back;
  p.st.sold++;log(`${p.name}: продан уровень «${perk(k).n}» за ${back}`);
  return true;
}
/* «Сдаться» стоит первой: по таймауту подставляется ПОСЛЕДНЯЯ кнопка, а ушедший
   игрок должен продолжать играть, а не автоматически сливать партию. */
async function askSale(p,need,owned){
  const btns=[['Сдаться',null,true]];
  owned.forEach(k=>{
    const back=Math.round(perk(k).cost[p.lv[k]-1]/2);
    btns.push([`${perk(k).n} ${p.lv[k]}→${p.lv[k]-1}: +${back}`,k,true]);
  });
  const v=await evAsk(p.id,`Нечем заплатить ${need}. На руках ${p.money}. Продайте уровень за полцены или сдайтесь.`,btns);
  return owned.includes(v)?v:null;
}
async function coverDebt(p,need){
  while(p.money<need){
    const owned=PK.filter(k=>p.lv[k]>0);
    if(!owned.length)return false;
    if(p.bot){if(!autoSell(p))return false;continue}
    const k=await askSale(p,need,owned);
    if(k===null){log(`${p.name}: партия сдана`);return false}
    p.lv[k]--;const back=Math.round(perk(k).cost[p.lv[k]]/2);p.money+=back;p.st.sold++;
    log(`${p.name}: продан уровень «${perk(k).n}» за ${back}`);
    render();
  }
  return true;
}
async function flip(p){
  const g=gen;busy=true;acts=[];note='';render();
  const alive=()=>g===gen&&!over;
  let v;
  // значение просим сразу, анимация крутится параллельно — сетевая задержка прячется под ней
  const spin=async pr=>{
    for(let i=0;i<7;i++){coin=Math.random()<.5?'1':'0';render();await sleep(60);if(!alive())throw STALE}
    return await pr;
  };
  if(p.force){v=p.force==='stay'?0:1;coin=String(v);msg=`${p.name}: жетон вместо броска`;render();await sleep(500)}
  else{
    const pr=evCoin(p.id);pr.catch(()=>{});
    v=await spin(pr);coin=String(v);render();
    const away=P[v?1-p.pos:p.pos]!==p;
    if(p.tok.reroll>0&&away&&cdLeft(p)===0){
      let again;
      if(p.bot){again=true;await sleep(400)}
      else again=await evAsk(p.id,`Выпало ${v}, ${p===meP()?'вы попадёте':'игрок попадёт'} в гости. Перебросить? Жетонов: ${p.tok.reroll}`,
        [['Перебросить',true],['Оставить',false,true]]);
      if(!alive())return;
      if(again){
        p.tok.reroll--;p.st.toks++;p.cd=rounds;log(`${p.name}: переброс монетки`);
        const pr2=evCoin(p.id);pr2.catch(()=>{});
        v=await spin(pr2);coin=String(v);
      }
    }
  }
  p.force=null;
  /* Три хода подряд на одной клетке невозможны: на третий выносит принудительно.
     Это убирает мёртвые ходы и заодно задаёт потолок всему, что повышает шанс остаться. */
  let forced=false;
  if(v===0&&p.streak>=2){v=1;forced=true;coin='1'}
  if(v===1)p.st.ones++;else p.st.zeros++;
  const beforeRect=rectOf(p);
  const wasHome=atHome(p);
  if(v===1){p.pos=1-p.pos;note='переход';
    msg=forced?`${p.name}: третий ход на месте — переход принудительно`:`${p.name}: выпала 1, шаг на соседнюю клетку`}
  else {msg=`${p.name}: выпал 0, остаётся на месте`;note='на месте'}
  render();animateMove(p,beforeRect,v===0);setTimeout(()=>{p.jump=false},280);await sleep(500);if(!alive())return;
  p.streak=(wasHome===atHome(p))?p.streak+1:1;
  if(atHome(p)){
    let gain=salary(p);let extra='';
    if(!wasHome&&val(p,'route')){gain+=val(p,'route');extra=`, Логистика +${val(p,'route')}`;p.st.route+=val(p,'route')}
    p.money+=gain;p.st.wage+=salary(p);p.st.home++;msg=`${p.name}: дома, +${gain} (зарплата ${salary(p)}${extra})`;log(msg);
  } else {
    const foe=P[p.pos],r=payFor(p,foe);
    const keep=Math.round(r*RENT_KEEP);
    const raid=Math.round(rentOf(foe)*inflation()*.12*(p.off.raid?0:p.lv.raid));
    const take=Math.min(raid,foe.money+keep);
    const need=Math.max(0,r-take);
    if(!await coverDebt(p,need)){foe.money+=p.money;p.money=0;render();await sleep(600);return end(foe)}
    p.money+=take-r;foe.money+=keep-take;
    p.st.paid+=r;p.st.away++;foe.st.got+=keep;p.st.raid+=take;
    foe.st.peak=Math.max(foe.st.peak,r);
    /* В строке обе стороны: итог одного «−24» читался как угодно — чей он, гостя или хозяина. */
    const sg=v=>(v>=0?'+':'−')+Math.abs(v);
    const tally=`Итог: ${p.name} ${sg(take-r)}, ${foe.name} ${sg(keep-take)}`;
    msg=!r&&!take
      ?`${p.name}: в гостях, ренты нет, никто ничего не платит`
      :take
        ?`${p.name}: в гостях, рента ${r}, половина сгорает, Рэкет возвращает гостю ${take}. ${tally}`
        :`${p.name}: в гостях, рента ${r}, половина сгорает. ${tally}`;
    log(msg);
    if(foe.money<0&&!await coverDebt(foe,0))return end(p);
  }
  if(goal()&&capital(p)>=goal()){render();await sleep(400);return end(p,'capital')}
  render();await sleep(550);if(!alive())return;
  if(p.bot)botBuild(p);
  render();await sleep(350);
}
/* Продать перк по своей воле нельзя: продажа превращала вложенное в наличные, и игрок
   добирал порог победы распродажей в один ход. Продажа осталась только в долгах (coverDebt).
   Взамен перк можно выключить — это нужно против Рэкета: с 5-го его уровня соперник
   забирает с вашей ренты больше, чем достаётся вам, и Аренда начинает работать на него.
   Переключение не тратит действие хода и не меняет деньги. */
function togglePerk(p,k){
  if(!PK.includes(k)||p.lv[k]<1)return;
  p.off[k]=!p.off[k];
  log(`${p.name}: перк «${perk(k).n}» ${p.off[k]?'выключен':'снова включён'}`);
}
function useToken(p,k){
  if(!TK.includes(k)||p.tok[k]<1||cdLeft(p)>0)return false;
  if(k==='anchor'&&p.streak>=2)return false;   // третий ход на месте всё равно станет переходом
  p.tok[k]--;p.st.toks++;p.cd=rounds;p.force=k==='anchor'?'stay':'move';
  log(`${p.name}: применён жетон «${TOKENS[k].n}»`);
  return true;
}
function buyToken(p,k){
  if(!TK.includes(k))return;
  const t=TOKENS[k],price=tokPrice(p,k);
  if(p.built||p.money<price)return;
  p.money-=price;p.tok[k]++;p.tokBuys[k]++;p.built=true;
  log(`${p.name}: куплен жетон «${t.n}» за ${price}${atHome(p)?'':' (в гостях, с наценкой)'}`);
}
/* «Акула» — линия, собранная из живых партий, а не из прогонов.
   Первые пять уровней Аренды окупаются, дальше кривая ломается; на чужой Рэкет
   отвечает Рэкетом; Контора приоритетнее Логистики, потому что платит на каждом
   ходе дома, а не только на возвращении. Купленную Аренду не продаёт никогда:
   вернуть половину вложенного хуже, чем терпеть урон от Рэкета. */
function sharkBuild(p){
  const foe=foeOf(p);
  // владельцу остаётся 50% ренты, Рэкет соперника забирает 12% за уровень: с 5-го уровня Аренда в минусе
  if(p.lv.rent>0&&!p.off.rent!==(foe.lv.raid<5||!!foe.off.raid))togglePerk(p,'rent');
  if(p.built||!atHome(p))return;
  const reserve=payFor(p,foe)+30;
  const can=k=>{const c=cost(p,k);return c!==null&&open(p,k)&&p.money-c>=reserve};
  if(foe.lv.rent>=2&&p.lv.raid<foe.lv.rent&&can('raid'))return buy(p,'raid');
  if(foe.lv.raid<2&&p.lv.rent<5&&can('rent'))return buy(p,'rent');
  if(can('office'))return buy(p,'office');
  // Логистика — догрузка к Конторе; если Контору закрыл драфт, она становится основной
  if((p.lv.office>=6||!open(p,'office'))&&can('route'))return buy(p,'route');
}
function botBuild(p){
  if(cfg.diff==='hard')return sharkBuild(p);
  if(p.built)return;
  if(!atHome(p)){
    if(p.tok.dash===0&&cdLeft(p)===0&&payFor(p,foeOf(p))>salary(p)&&p.money-tokPrice(p,'dash')>payFor(p,foeOf(p)))buyToken(p,'dash');
    return;
  }
  if(cfg.diff==='easy'&&rnd()<.35)return;
  const k=cfg.diff==='easy'?3.5:cfg.diff==='hard'?1:2;
  const reserve=Math.round(payFor(p,foeOf(p))*k)+(cfg.diff==='hard'?20:cfg.diff==='easy'?90:50);
  const can=botPlan.filter(k=>open(p,k)&&cost(p,k)!==null&&p.money-cost(p,k)>=reserve);
  const wantTok=cfg.diff==='hard'?.35:cfg.diff==='easy'?.1:.2;
  const tot=TK.reduce((s,k)=>s+p.tok[k],0);
  if(tot<3&&rnd()<wantTok){
    const k=payFor(p,foeOf(p))>salary(p)?'reroll':'anchor';
    if(p.money-tokPrice(p,k)>=reserve){buyToken(p,k);return}
  }
  if(can.length)buy(p,can[0]);
}
function botTokens(p){
  const danger=payFor(p,foeOf(p));
  if(cdLeft(p)===0&&atHome(p)&&p.streak<2&&p.tok.anchor>0&&danger>salary(p)*.8){p.tok.anchor--;p.st.toks++;p.cd=rounds;p.force='stay';log(`${p.name}: применён жетон «Якорь»`)}
  else if(cdLeft(p)===0&&!atHome(p)&&p.tok.dash>0){p.tok.dash--;p.st.toks++;p.cd=rounds;p.force='move';log(`${p.name}: применён жетон «Рывок»`)}
}

/* Перед первым броском каждый закрывает сопернику один перк на всю партию. Это
   единственное, что отличает партии друг от друга ещё до начала: набор из четырёх
   перков у каждого свой, поэтому заученного дебюта не остаётся.
   Запреты выбираются по очереди, но применяются оба разом — пока второй не решил,
   первый бан не виден ни в перках, ни в логе. Иначе второй банил бы, зная ответ. */
function botBan(p){
  const r=rnd();
  if(cfg.diff==='easy')return PK[r*PK.length|0];
  if(cfg.diff==='normal')return r<.5?'rent':'office';
  return r<.6?'route':'office';   // Акула закрывает то, чем её чаще всего обыгрывают
}
async function draftPhase(){
  if(!cfg.draft)return;
  const bans=[];
  for(let i=0;i<2;i++){
    const p=P[i];
    /* botBan двигает ГПСЧ, поэтому вызывается ровно один раз и на всех клиентах
       одинаково — даже когда банит человек и значение уходит в запас. */
    const dflt=botBan(p);
    let k=dflt;
    if(!p.bot){
      tab='perks';
      const v=await evAsk(i,'Закройте сопернику один перк на всю партию. Ваш выбор он увидит, только когда решит сам.',
        PERKS.map(pk=>[pk.n,pk.k,false]),dflt);
      if(PK.includes(v))k=v;
    }
    if(over)return;
    bans[1-i]=k;   // банят сопернику, а не себе
  }
  P[0].ban=bans[0];P[1].ban=bans[1];
  log(`Драфт: ${P[0].name} — без перка «${perk(bans[0]).n}», ${P[1].name} — без перка «${perk(bans[1]).n}»`);
  msg=`Драфт закрыт. ${P[0].name}: нет «${perk(bans[0]).n}». ${P[1].name}: нет «${perk(bans[1]).n}».`;
  acts=[];render();await sleep(1100);

/* Главный цикл партии, одинаковый у всех клиентов. Всё, что нельзя вычислить —
   монетка и решения живых игроков, — приходит событиями в общем порядке. */
async function gameLoop(){
  try{
    await draftPhase();
    while(!over){
      const p=P[turn];
      if(p.bot){acts=[];idleCtx=null;busy=true;msg=`Ход ${p.name}`;render();await sleep(450)}
      else await idlePhase(p);
      if(over)return;
      await flip(p);
      if(over)return;
      turn=1-turn;P[turn].built=false;
      if(turn===0){
        rounds++;
        if(rounds%INFL_EVERY===0){
          log(`Инфляция: рента подорожала, теперь множитель ×${inflation().toFixed(1).replace('.',',')}`);
          inflFlash();await leaderTax();if(over)return;
        }
      }
      if(P[turn].bot)botTokens(P[turn]);
    }
  }catch(e){if(e!==STALE)throw e}
}
const runGame=()=>gameLoop().catch(e=>{if(e===STALE)return;console.error(e);msg='Ошибка партии, смотрите консоль';acts=[];render()});
/* Фаза до броска: игрок строит, продаёт, покупает жетон — и заканчивает её броском.
   Каждое действие едет отдельным событием, поэтому картина у обоих одинаковая. */
async function idlePhase(p){
  while(true){
    const seq=evCur;
    renderIdle(p,seq);
    if(p.id!==mySeat&&mp.absent.has(p.id))evEmit({kind:'act',seat:p.id,seq,v:{k:'roll'}});
    const ev=await evStall(seq,p.id,()=>evEmit({kind:'act',seat:p.id,seq,v:{k:'roll'}}));
    const a=ev.v;
    if(!a||typeof a!=='object'||typeof a.k!=='string')continue;
    if(a.k==='roll')return;
    if(a.k==='use'){if(useToken(p,a.key))return;continue}
    if(a.k==='buy')buy(p,a.key);
    else if(a.k==='toggle')togglePerk(p,a.key);
    else if(a.k==='tok')buyToken(p,a.key);
    render();
  }
}

  const send=v=>{idleCtx=null;evEmit({kind:'act',seat:p.id,seq,v})};
  idleCtx={p,seq,send};
  msg=atHome(p)?(p.built?'Постройка в этом ходу уже сделана. Бросайте монетку.':'Вы дома: можно вложить деньги в один перк, потом бросайте монетку.')
    :(p.built?'Вы в гостях, действие хода уже потрачено. Бросайте монетку.':'Вы в гостях: перки строить нельзя, но жетон купить можно, он дороже на 50%.');

function mpConnect(code){

  let ws;try{ws=new WebSocket(WS_URL)}catch(e){return mpFail('Не удалось открыть соединение.')}

  };
  if($('lWeb'))$('lWeb').onclick=()=>{
    try{navigator.clipboard.writeText(webLink).then(()=>{$('lWeb').textContent='Скопировано'},()=>prompt('Ссылка для браузера:',webLink))}
    catch(e){prompt('Ссылка для браузера:',webLink)}
  };
  if($('lShare'))$('lShare').onclick=()=>{
    const url=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Сыграем в «Два квадрата»?')}`;
    try{TG.openTelegramLink(url)}catch(e){prompt('Ссылка для соперника:',link)}
  };
  if($('lGo'))$('lGo').onclick=()=>{mpSend({t:'config',bots:0,opts:{goal:cfg.goal,start:cfg.start,diff:cfg.diff,draft:cfg.draft}});mpSend({t:'start'})};
  $('lExit').onclick=()=>{const w=mp.ws;mp.ws=null;try{w&&w.close()}catch(e){}net.mode='local';showSetup()};
}

initTG();
applyColor();
/* Приглашение приходит ссылкой ?room=CODE или диплинком startapp=CODE и ведёт прямо в комнату, мимо настроек. */
const joinCode=(()=>{
  const q=QS.get('room');if(q)return q;
  try{const sp=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param;if(sp)return String(sp)}catch(e){}
  return '';
})().toUpperCase().replace(/[^A-F0-9]/g,'').slice(0,6);
if(joinCode)mpConnect(joinCode);
else showSetup();
</script>
</body>
