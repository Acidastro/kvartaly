<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Два квадрата</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Токены из макета (README). Тёмная тема — по умолчанию; светлую задаёт Telegram
   (data-theme) или система, если открыто в браузере. */
:root{
  --bg:#111319;--surf:#1A1D26;--surf2:#232733;--line:#363C4D;--text:#F3F0E8;--dim:#A5ABBB;
  --ink:#07080C;--gold:#FFC53D;--goldEdge:#B8861A;--goldInk:#1A1405;--good:#3DDBA8;--bad:#FF6A83;
  --dot:rgba(255,255,255,.05);
  --you:#7B61FF;--foe:#B5E853;--youInk:#FFFFFF;--foeInk:#15131C;
  --num:Unbounded,system-ui,sans-serif;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#F1ECE3;--surf:#FFFFFF;--surf2:#F6F2EA;--line:#DDD5C7;--text:#1C1A16;--dim:#646054;
    --ink:#D3CABB;--goldEdge:#C9901C;--good:#0B7F5F;--bad:#C62D4E;--dot:rgba(70,50,20,.08)}
}
:root[data-theme="light"]{--bg:#F1ECE3;--surf:#FFFFFF;--surf2:#F6F2EA;--line:#DDD5C7;--text:#1C1A16;--dim:#646054;
  --ink:#D3CABB;--goldEdge:#C9901C;--good:#0B7F5F;--bad:#C62D4E;--dot:rgba(70,50,20,.08)}
*{box-sizing:border-box}
html,body{height:var(--app-h,100%)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);
  background-size:18px 18px;color:var(--text);font-family:Onest,system-ui,sans-serif;font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow:hidden;padding:env(safe-area-inset-top,0) 0 0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--you);outline-offset:2px}
b{font-weight:700}
/* имя игрока может быть длинным — везде обрезаем многоточием */
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Экран прокручивается целиком (макет 04 — «тот же экран, прокрученный вниз»): ряды сверху
   не сжимаются, а лист внизу растёт вместе с содержимым. */
.app{height:100%;overflow-y:auto;overscroll-behavior:contain}
.col{max-width:520px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:8px 16px 0}
.col>*{flex:none}

/* верхняя строка */
.top{display:flex;align-items:center;gap:6px;height:44px}
.tb{display:flex;align-items:center;gap:5px;height:44px;padding:0 12px;border-radius:12px;background:var(--surf);
  font-size:12.5px;color:var(--dim)}
.tb b{font-family:var(--num);font-size:13px;color:var(--text)}
.infl{flex-grow:1;min-width:0;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;line-height:1.15}
.infl .l1{font-weight:600;color:var(--text)}
.infl .l2{font-size:11px;color:var(--dim)}
.infl.hot{background:color-mix(in srgb,var(--bad) 14%,var(--surf))}
.infl.hot .l1,.infl.hot .l1 b{color:var(--bad)}
.spd{justify-content:center;min-width:44px;padding:0 10px;font-family:var(--num);font-size:13px;font-weight:700}
.ico{justify-content:center;width:44px;padding:0;color:var(--text)}
.note{margin:0;padding:12px 14px;border-radius:16px;background:var(--surf);border:2px solid var(--line);
  font-size:13px;color:var(--dim);line-height:1.45}
.note[hidden]{display:none}

/* карточки игроков */
.hud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.who{min-width:0;display:flex;flex-direction:column;gap:3px;padding:11px 13px 12px;background:var(--surf);
  border:2px solid transparent;border-radius:18px;box-shadow:0 4px 0 var(--ink);transition:border-color .2s}
.who.a{--c:var(--you);--ci:var(--youInk)}.who.b{--c:var(--foe);--ci:var(--foeInk)}
.who.acting{border-color:var(--c)}
.whead{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);min-height:22px}
.sq{flex:none;width:10px;height:10px;border-radius:3px;background:var(--c)}
.turn{flex:none;margin-left:auto;padding:2px 8px;border-radius:6px;background:var(--c);color:var(--ci);font-size:11px;font-weight:700}
.who:not(.acting) .turn{display:none}
.vrow{display:flex;align-items:center;gap:8px;min-height:36px;min-width:0}
.val{font-family:var(--num);font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.dbadge{flex:none;padding:2px 9px;border-radius:8px;font-family:var(--num);font-size:15px;font-weight:700}
.dbadge[hidden]{display:none}
.pos{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.neg{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.who .sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who.tired .sub{color:var(--gold)}
.bar{height:6px;margin-top:5px;border-radius:999px;background:var(--surf2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--c);transition:width .3s}
.capv{font-size:11px;color:var(--dim)}

/* поле */
.board{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px;background:var(--surf)}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cell{position:relative;min-width:0;height:150px;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:10px 10px 9px;border:3px solid var(--c);border-radius:14px;
  background:color-mix(in srgb,var(--c) 13%,var(--surf2))}
.cell.a{--c:var(--you)}.cell.b{--c:var(--foe)}
.cttl{align-self:stretch;font-size:11.5px;font-weight:600;color:var(--dim)}
.pawns{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:100%}
.pawn{display:block;min-width:58px;max-width:100%;height:32px;line-height:32px;text-align:center;padding:0 12px;
  border-radius:10px;font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.pawn.a{background:var(--you);color:var(--youInk)}.pawn.b{background:var(--foe);color:var(--foeInk)}
.pawn.guest{outline:2px dashed var(--text);outline-offset:3px}
.rent{display:flex;align-items:baseline;gap:5px;font-size:11.5px;color:var(--dim);white-space:nowrap}
.rent b{font-family:var(--num);font-size:17px;color:var(--text)}
.rent u{text-decoration:none;font-size:11px;font-weight:700;color:var(--bad)}
.rent.off{font-weight:600;color:var(--good)}
.rent.bump b{display:inline-block;animation:bump 1.1s cubic-bezier(.25,1.2,.4,1)}
@keyframes bump{0%{transform:scale(1)}18%{transform:scale(1.45);color:var(--bad)}45%{transform:scale(1);color:var(--bad)}100%{transform:scale(1)}}
.hit{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--num);font-size:18px;font-weight:800;
  pointer-events:none;z-index:4;animation:hitup 1.8s cubic-bezier(.2,.9,.3,1) forwards;padding:2px 10px;border-radius:10px;
  background:var(--surf);white-space:nowrap}
.hit.minus{color:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 45%,transparent)}
@keyframes hitup{0%{opacity:0;transform:translate(-50%,14px) scale(.6)}12%{opacity:1;transform:translate(-50%,-4px) scale(1.2)}
  24%{transform:translate(-50%,0) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
.coinrow{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);gap:14px;align-items:center}
.chip{padding:4px 10px;border-radius:8px;background:var(--surf2);font-size:12.5px;color:var(--dim);white-space:nowrap;
  transition:background .2s,color .2s}
.chip b{font-family:var(--num);color:var(--text)}
.chip.l{justify-self:end}.chip.r{justify-self:start}
/* чип исхода заливается цветом того, кто бросал; второй остаётся серым */
.chip.hit-a{background:var(--you);color:var(--youInk);font-weight:700}
.chip.hit-b{background:var(--foe);color:var(--foeInk);font-weight:700}
.chip.hit-a b,.chip.hit-b b{color:inherit}
.coin{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--gold);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 var(--goldEdge);
  font-family:var(--num);font-size:24px;font-weight:800;color:#2B1F00}
.coin.flip{animation:spin .4s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}

/* карточка события после броска */
.event{display:flex;flex-direction:column;gap:6px;height:78px;overflow:hidden;padding:12px 14px;border-radius:16px;
  background:var(--surf);border:2px solid var(--line);transition:opacity .2s}
.event[hidden]{display:none}
.event.stale{opacity:.5}
.event.good{border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.event.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.event .ttl{display:flex;min-width:0;font-size:14px;font-weight:600;white-space:nowrap}
/* обрезается имя, а не суть: «Константи… в гостях: рента 50» */
.event .enm{flex:0 100 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.event .rest{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.event .ask{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.event .chips{display:flex;flex-wrap:nowrap;gap:8px;font-size:13px;min-width:0;overflow:hidden}
.echip{flex:0 1 auto;min-width:0;padding:3px 9px;border-radius:8px;font-weight:700}
.echip.zero{background:var(--surf2);color:var(--dim);font-weight:600}

/* жетоны под полем */
.toks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tk{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:58px;padding:9px 11px;border-radius:14px;
  background:var(--surf);border:2px solid var(--line);text-align:left;min-width:0}
.tk .tn{display:flex;align-items:center;gap:4px;width:100%;font-size:13.5px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.tk .cnt{margin-left:auto;display:grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--surf2);
  font-family:var(--num);font-size:11.5px;flex:none}
.tk .th{font-size:11.5px;color:var(--dim);min-height:2.8em;line-height:1.4}
.tk.can{border-color:var(--you)}
.tk.can .th{display:flex;align-items:center;gap:5px;font-weight:700;color:var(--text)}
.tk.can .th::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--you)}
.tk.none{opacity:.5}
.tk:disabled{cursor:default}

/* главная кнопка / статус хода / ответы на вопрос — одна высота, чтобы раскладка не прыгала */
.action{display:flex;flex-direction:column;gap:8px}
.action .row{display:flex;gap:8px}
.main{display:flex;align-items:center;justify-content:center;height:56px;border-radius:16px;background:var(--gold);color:var(--goldInk);
  font-size:17px;font-weight:700;text-align:center;box-shadow:0 8px 24px -10px rgba(255,197,61,.55);width:100%}
.main:disabled{opacity:.55;cursor:default}
.main.alt{background:var(--surf);color:var(--text);border:2px solid var(--line);box-shadow:none;font-size:15px}
.row .main{flex:1;min-width:0}
.statusline{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 16px;border-radius:16px;
  background:color-mix(in srgb,var(--c) 12%,var(--surf));font-size:15px;font-weight:600}
.statusline.a{--c:var(--you)}.statusline.b{--c:var(--foe)}
.statusline .sq{width:12px;height:12px}

/* нижний лист */
.sheet{flex:1 0 auto;display:flex;flex-direction:column;gap:10px;margin:0 -16px;padding:10px 12px 20px;
  border-radius:24px 24px 0 0;background:var(--surf);box-shadow:0 -1px 0 var(--line)}
.grip{align-self:center;width:40px;height:4px;border-radius:999px;background:var(--line)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surf2)}
.tab{flex-grow:1;height:38px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--dim);text-align:center}
.tab[aria-selected="true"]{background:var(--surf);font-weight:600;color:var(--text)}
.pane[hidden]{display:none}
.list{display:flex;flex-direction:column;gap:10px}

/* перки */
.pk{display:flex;flex-direction:column;padding:10px 12px;border-radius:16px;background:var(--surf2);border:2px solid var(--line)}
.pk.ready{border-color:color-mix(in srgb,var(--you) 45%,transparent)}
.pk.paused{border-style:dashed}
.pk.paused .ring,.pk.paused .pname{opacity:.55}
.pkrow{display:flex;align-items:center;gap:12px}
.ring{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c) var(--p),var(--line) 0)}
.ring.a{--c:var(--you)}.ring.b{--c:var(--foe)}
.ring b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--surf2);font-family:var(--num);font-size:14px}
.pkbody{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pname{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.q{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surf);color:var(--dim);font-size:11px;font-weight:700;flex:none}
.pk .now{font-size:12px;color:var(--dim)}
.pk .next{font-size:12px;font-weight:600}
.pk .why{font-size:12px;color:var(--dim)}
.psw{margin-left:auto;flex:none;display:flex;width:34px;height:20px;padding:2px;border-radius:999px;background:var(--line);transition:background .15s}
.psw::after{content:'';width:16px;height:16px;border-radius:50%;background:#FFFFFF}
.psw[aria-checked="true"]{background:var(--you)}
.psw[aria-checked="true"]::after{margin-left:auto}
.psw:disabled{opacity:.45;cursor:default}
.up{flex:none;display:flex;flex-direction:column;align-items:center;width:92px;padding:7px 10px;border-radius:12px;
  background:var(--you);color:var(--youInk);box-shadow:0 3px 0 var(--ink)}
.up span{font-size:10.5px;font-weight:600;white-space:nowrap}
.up b{font-family:var(--num);font-size:16px}
.up:disabled{background:var(--surf);color:var(--dim);box-shadow:none;cursor:default}
.howto{margin-top:6px;padding-top:7px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);line-height:1.45}
.pk.banned{flex-direction:row;align-items:center;gap:12px;background:color-mix(in srgb,var(--bad) 10%,var(--surf2));border-color:var(--bad)}
.lock{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.pk.banned .pname{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.pk.banned .why{color:var(--bad)}
.shophead{display:flex;align-items:baseline;gap:8px;padding:10px 4px 0}
.shophead b{font-family:var(--num);font-size:15px}
.shophead span{font-size:12px;color:var(--dim)}
.tkshop{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surf2)}
.tkshop .num{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--surf);
  font-family:var(--num);font-size:15px;font-weight:700}
.tkshop .d{font-size:12px;color:var(--dim)}
.buy{flex:none;display:flex;flex-direction:column;align-items:center;width:92px;padding:7px 10px;border-radius:12px;
  background:var(--surf);border:2px solid var(--line)}
.buy span{font-size:10.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.buy b{font-family:var(--num);font-size:16px}
.buy:disabled{opacity:.45;cursor:default}

/* вкладки «Соперник», «Лог», «Правила» */
.frow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surf2)}
.frow .now{font-size:12px;color:var(--dim)}
.frow.banned{background:color-mix(in srgb,var(--bad) 10%,var(--surf2))}
.frow.banned .pname{color:var(--bad);text-decoration:line-through}
.frow.banned .now{color:var(--bad)}
.frow.paused .now{color:var(--good);font-weight:600}
.log{list-style:none;margin:0;padding:0 4px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--dim)}
.log .fresh{color:var(--text)}
.log .pn{font-weight:700;--pnmix:82%}
:root[data-theme="light"] .log .pn{--pnmix:55%}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .log .pn{--pnmix:55%}}
.log .pn.a{color:color-mix(in srgb,var(--you) var(--pnmix),var(--text))}
.log .pn.b{color:color-mix(in srgb,var(--foe) var(--pnmix),var(--text))}
.rules{padding:0 4px;font-size:13px;color:var(--dim);line-height:1.5}
.rules h3{font-family:var(--num);font-size:14px;font-weight:700;color:var(--text);margin:16px 0 4px}
.rules h3:first-child{margin-top:4px}
.rules p{margin:0 0 4px}
.rules ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.rules li::marker{color:var(--you)}
.rules b{color:var(--text);font-weight:600}
.rules .mut{margin-top:5px;font-size:12px}

/* полноэкранные страницы поверх игры: старт, меню, драфт, итог, лобби, статистика */
.overlay{position:fixed;inset:0;z-index:9;overflow-y:auto;overscroll-behavior:contain;background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:18px 18px;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.overlay[hidden]{display:none}
.page{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding:28px 16px 24px}
.page.tight{gap:12px;padding-top:24px}
.page.result{gap:14px;padding-top:24px}
.logo{display:flex;gap:8px}
.logo i{width:44px;height:44px;border-radius:10px;background:var(--you);box-shadow:0 4px 0 var(--ink)}
.logo i+i{background:var(--foe);transform:rotate(8deg)}
.page h1{margin:0;font-family:var(--num);font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.lead{margin:0;font-size:15px;color:var(--dim);text-wrap:pretty}
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bgold{display:flex;align-items:center;justify-content:center;height:58px;border-radius:16px;background:var(--gold);color:#2B1F00;
  font-family:var(--num);font-size:16px;font-weight:700;box-shadow:0 5px 0 var(--goldEdge);text-align:center;width:100%}
.bmain{height:56px;border-radius:16px;background:var(--gold);color:var(--goldInk);font-size:17px;font-weight:700;text-align:center;
  box-shadow:0 8px 24px -10px rgba(255,197,61,.55);width:100%}
.bmain:disabled,.bline:disabled{opacity:.5;cursor:default}
.bline{height:50px;border-radius:14px;background:var(--surf);border:2px solid var(--line);font-size:14.5px;font-weight:600;text-align:center;width:100%}
.sect .bline{background:var(--surf2)}
.sect{display:flex;flex-direction:column;gap:18px;padding:16px 14px 18px;border-radius:20px;background:var(--surf)}
.shead{display:flex;flex-direction:column;gap:2px}
.shead b,.sttl{font-family:var(--num);font-size:15px;font-weight:700}
.shead span{font-size:12.5px;color:var(--dim)}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>span{font-size:12.5px;color:var(--dim)}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:12px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surf),0 0 0 5.5px var(--text)}
/* занятый цвет остаётся узнаваемым, но зачёркнут: полупрозрачный жёлтый на тёмном выглядел бы бурым, «новым» цветом */
.sw:disabled{opacity:.45;cursor:not-allowed;background-image:linear-gradient(45deg,transparent 44%,var(--surf) 44% 56%,transparent 56%)}
.grid{display:grid;gap:6px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{display:flex;flex-direction:column;gap:2px;min-height:56px;padding:9px 10px;border-radius:14px;background:var(--surf2);
  border:2px solid transparent;text-align:left;font-size:11.5px;color:var(--dim);line-height:1.25;min-width:0}
.opt b{font-family:var(--num);font-size:13px;color:var(--text)}
.opt[aria-pressed="true"]{border-color:var(--you)}
.opt.c{min-height:48px;justify-content:center;align-items:center;text-align:center}
.swt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 12px 0 14px;border-radius:14px;
  background:var(--surf2);font-size:14px;font-weight:600}
.swt i{display:flex;width:40px;height:24px;padding:3px;border-radius:999px;background:var(--line);transition:background .15s}
.swt i::after{content:'';width:18px;height:18px;border-radius:50%;background:#FFFFFF;transition:margin .15s}
.swt[aria-checked="true"] i{background:var(--you)}
.swt[aria-checked="true"] i::after{margin-left:auto}
.mhead{display:flex;align-items:center;gap:12px}
.mhead>div{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mhead h1{font-size:28px;line-height:1.1}
.mhead span{font-size:13px;color:var(--dim)}
.xbtn{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--surf)}
.inp{width:100%;height:48px;padding:0 14px;border-radius:14px;background:var(--surf2);border:2px solid var(--line);color:inherit;font:inherit}
.inp:focus{outline:none;border-color:var(--you)}
.who2{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surf2);font-size:14px}
.who2 .sq{width:12px;height:12px}
.who2 .ell{flex-grow:1}
.who2 small{flex:none;font-size:12px;color:var(--dim)}

/* драфт */
.kick{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--dim)}
.kick i{width:18px;height:18px;border-radius:5px;background:var(--you)}
.kick i+i{background:var(--foe)}
.kick b{display:flex;gap:5px;font-weight:inherit}
.page.tight h1{font-size:32px;letter-spacing:-.02em;line-height:1.1}
.page.tight .lead{margin-bottom:6px;font-size:14px}
.dname{display:inline-block;max-width:12em;vertical-align:bottom;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard{display:flex;align-items:center;gap:14px;min-height:72px;padding:12px 14px;border-radius:16px;background:var(--surf);
  border:2px solid var(--line);box-shadow:0 4px 0 var(--ink);text-align:left;width:100%}
.dcard>div{flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.dcard b{font-family:var(--num);font-size:16px}
.dcard span{font-size:12.5px;color:var(--dim);line-height:1.35}
.dcard small{font-size:11.5px;color:var(--dim)}
.dcard .dl{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--surf2);color:var(--dim)}
.dcard.pick{background:color-mix(in srgb,var(--bad) 10%,var(--surf));border-color:var(--bad)}
.dcard.pick .dl{color:var(--bad)}
.dcard:disabled{cursor:default}
.dcard[data-wait]{opacity:.6}
.dfoot{flex-grow:1;display:flex;align-items:flex-end;justify-content:center;gap:8px;min-height:40px;font-size:12.5px;color:var(--dim);text-align:center}
.dfoot i{flex:none;width:8px;height:8px;border-radius:2px;background:var(--foe);margin-bottom:5px}

/* итог */
.rhero{display:flex;flex-direction:column;gap:16px;padding:20px 18px;border-radius:24px;background:var(--surf)}
.rhero .meta{font-size:12.5px;font-weight:600;color:var(--dim)}
.rhero h1{font-size:44px;letter-spacing:-.04em;line-height:1}
.rhero p{margin:0;font-size:15px;color:var(--dim)}
.rcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rcard{display:flex;flex-direction:column;gap:8px;min-width:0;padding:12px 14px 14px;border:3px solid var(--c);border-radius:14px;
  background:color-mix(in srgb,var(--c) 16%,var(--surf2))}
.rcard.a{--c:var(--you);--ci:var(--youInk)}.rcard.b{--c:var(--foe);--ci:var(--foeInk)}
.rcard .nm{display:flex;align-items:center;gap:7px;min-width:0;font-size:12px;font-weight:600;color:var(--dim)}
.rcard .nm .sq{background:var(--c)}
.rcard>b,.brow b,.trow b{white-space:nowrap}
.page.result .bline{height:56px;font-size:15px}
.rcard>b{font-family:var(--num);font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
.rtag{align-self:flex-start;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--c);color:var(--ci)}
.rtag.lost{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend .ell{max-width:96px}
.legend .sq.a{background:var(--you)}.legend .sq.b{background:var(--foe)}
.rblock{display:flex;flex-direction:column;gap:14px;padding:16px 16px 18px;border-radius:20px;background:var(--surf)}
.rblock.tbl{gap:0;padding-bottom:10px}
.rbh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rblock.tbl .rbh{padding-bottom:10px}
.metric{display:flex;flex-direction:column;gap:5px}
.metric>span{font-size:12.5px;color:var(--dim)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px;align-items:center}
.brow>i{height:8px;border-radius:999px;background:var(--surf2);overflow:hidden}
.brow>i>i{display:block;height:100%;border-radius:999px}
.brow.a>i>i{background:var(--you)}.brow.b>i>i{background:var(--foe)}
.brow b{text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.brow b.lo{font-weight:500;color:var(--dim)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px;gap:6px;padding:7px 0;border-top:1px solid var(--surf2);font-size:13px;color:var(--dim)}
.trow b{text-align:right;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

/* строки статистики игрока */
.stats{display:flex;flex-direction:column;gap:0}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:13px;color:var(--dim);padding:8px 0;border-top:1px solid var(--surf2)}
.srow:first-child{border-top:0}
.srow b{text-align:right;color:var(--text);font-weight:600;white-space:nowrap}
.srow b i{font-style:normal;color:var(--dim);font-weight:500;margin-left:6px}
.srow small{color:var(--dim)}
.note2{margin:0;font-size:12.5px;color:var(--dim);text-align:center}
@media (prefers-reduced-motion:reduce){.coin.flip{animation:none}.hit{animation:none;opacity:0}}
</style>
</head>
<body>
<div class="app"><div class="col">
  <div class="top">
    <span class="tb">круг <b id="round">1</b></span>
    <button class="tb infl" id="infl"><span class="l1">рента <b id="inflNow">+0%</b></span><span class="l2" id="inflnext"></span></button>
    <button class="tb spd" id="speedBtn">×1</button>
    <button class="tb ico" id="menuBtn" aria-label="Меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <p class="note" id="inflNote" hidden></p>

  <div class="hud">
    <div class="who a" id="hud0"><div class="whead"><span class="sq"></span><span class="ell" id="nm0">Вы</span><span class="turn">ходит</span></div>
      <div class="vrow"><span class="val" id="money0">0</span><span class="dbadge" id="dslot0" hidden></span></div>
      <span class="sub" id="sub0"></span><div class="bar" id="bar0"><i id="cap0"></i></div><span class="capv" id="capv0"></span></div>
    <div class="who b" id="hud1"><div class="whead"><span class="sq"></span><span class="ell" id="nm1">Соперник</span><span class="turn">ходит</span></div>
      <div class="vrow"><span class="val" id="money1">0</span><span class="dbadge" id="dslot1" hidden></span></div>
      <span class="sub" id="sub1"></span><div class="bar" id="bar1"><i id="cap1"></i></div><span class="capv" id="capv1"></span></div>
  </div>

  <div class="board">
    <div class="cells">
      <div class="cell a" id="cellA"><span class="cttl ell" id="ttlA">ваша клетка</span><div class="pawns" id="pawnsA"></div><span class="rent" id="rentA"></span></div>
      <div class="cell b" id="cellB"><span class="cttl ell" id="ttlB">клетка соперника</span><div class="pawns" id="pawnsB"></div><span class="rent" id="rentB"></span></div>
    </div>
    <div class="coinrow">
      <span class="chip l" id="chip0"><b>0</b> — на месте</span>
      <div class="coin" id="coin" role="img" aria-label="Монетка: ещё не брошена">?</div>
      <span class="chip r" id="chip1"><b>1</b> — переход</span>
    </div>
  </div>

  <div class="event" id="event" hidden></div>
  <div class="toks" id="toks"></div>
  <div class="action" id="acts"></div>

  <div class="sheet">
    <span class="grip"></span>
    <div class="tabs">
      <button class="tab" data-tab="perks">Перки</button>
      <button class="tab" data-tab="foe">Соперник</button>
      <button class="tab" data-tab="log">Лог</button>
      <button class="tab" data-tab="rules">Правила</button>
    </div>
    <div class="pane" data-tab="perks"><div class="list" id="perks"></div></div>
    <div class="pane" data-tab="foe" hidden><div class="list" id="foeperks"></div></div>
    <div class="pane" data-tab="log" hidden><ul class="log" id="log"></ul></div>
    <div class="pane" data-tab="rules" hidden><div class="rules" id="rules"></div></div>
  </div>
</div></div>
<div class="overlay" id="ov" hidden><div class="page" id="panel"></div></div>
<script>
const MAXLV=10, BASE_SALARY=60;
/* Доля ренты, которая достаётся владельцу; остальное сгорает. Балансовый рычаг:
   чем меньше, тем хуже Аренда как источник дохода и тем безопаснее её игнорировать. */
let RENT_KEEP=.5;
const COLORS=[['#7B61FF','фиолетовый',258],['#38D9A9','мятный',165],['#4CC9F0','голубой',195],['#FF5470','малиновый',348],['#FFC53D','жёлтый',43],['#B5E853','лаймовый',82]];
const hueOf=c=>(COLORS.find(x=>x[0]===c)||COLORS[0])[2];
function foeColor(from){
  const h=hueOf(from||cfg.color);
  let best=COLORS[0],bd=-1;
  COLORS.forEach(([c,n,ch])=>{const d=Math.min(Math.abs(ch-h),360-Math.abs(ch-h));if(d>bd){bd=d;best=[c,n,ch]}});
  return best;
}
const GOLD=[[180,'скромный'],[260,'обычный'],[400,'богатый']];
const TOKENS={
  reroll:{n:'Переброс',d:'Если бросок уводит в гости, можно перебросить.',price:60},
  anchor:{n:'Якорь',d:'Вместо броска остаться на месте.',price:80},
  dash:{n:'Рывок',d:'Вместо броска шагнуть на соседнюю клетку.',price:80},
};
const TK=Object.keys(TOKENS);
const DIFFS={easy:['Новичок','копит и строится медленно'],normal:['Делец','держит запас, ровно поднимает перки'],hard:['Акула','отвечает на ваши перки']};
let cfg={color:'#7B61FF',start:260,diff:'normal',goal:600,speed:'normal',draft:true,sound:true,haptic:true};
const GOALS=[[0,'выкл'],[450,'быстрая'],[600,'обычная'],[900,'долгая']];
/* Темп — это только длительность пауз, на правила он не влияет. Партия в 65 кругов
   при «обычном» идёт около 4,5 минут, при «быстром» — меньше двух. */
const SPEED={slow:[1.5,'спокойно'],normal:[1,'обычно'],fast:[.45,'быстро'],instant:[0,'мгновенно']};
const sp=()=>(SPEED[cfg.speed]||SPEED.normal)[0];
// всплывающие цифры живут по тому же темпу, иначе на «мгновенно» висят уже после хода
const vis=ms=>Math.round(ms*Math.max(.15,sp()));

/* ---------- звук и вибрация ---------- */
/* Синтез через WebAudio, без файлов. Звук и вибрация — чистая косметика, поэтому здесь
   можно и meP(), и Math.random(): на ход партии и на синхронность они не влияют. */
let actx;
function tone(f,d=.08,type='sine',v=.07,delay=0){
  if(!cfg.sound)return;
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime+delay;
    const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
// iOS не даёт стартовать AudioContext вне пользовательского жеста — будим его на первом тапе
function unlockAudio(){
  if(!cfg.sound)return;
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}
}
// impact-вибрацию троттлим: вращение монетки дёргает её семь раз подряд
let hapLast=0;
function hap(kind){
  if(!cfg.haptic||typeof inTG==='undefined'||!inTG||!TG.HapticFeedback)return;
  const notif=kind==='success'||kind==='error'||kind==='warning';
  if(!notif){const t=performance.now();if(t-hapLast<110)return;hapLast=t}
  try{notif?TG.HapticFeedback.notificationOccurred(kind):TG.HapticFeedback.impactOccurred(kind)}catch(e){}
}
/* При перемотке журнала и на «мгновенном» темпе молчим: там десятки событий в секунду,
   и звук превратился бы в треск. Итог партии звучит всегда. */
const quiet=()=>replaying||sp()===0;
const sfx={
  tick:()=>{if(quiet())return;tone(300+Math.random()*260,.025,'square',.02);hap('light')},
  go:()=>{if(quiet())return;tone(520,.07,'triangle',.06);tone(700,.09,'triangle',.06,.06);hap('medium')},
  stay:()=>{if(quiet())return;tone(330,.12,'triangle',.05);hap('soft')},
  gain:()=>{if(quiet())return;tone(880,.06,'sine',.05);tone(1175,.1,'sine',.05,.05);hap('light')},
  pay:()=>{if(quiet())return;tone(320,.12,'triangle');tone(230,.16,'triangle',.07,.1);hap('warning')},
  buy:()=>{if(quiet())return;tone(520,.1);tone(780,.14,'sine',.07,.09);hap('medium')},
  foeBuy:()=>{if(quiet())return;tone(196,.12,'sine',.04)},
  token:()=>{if(quiet())return;[660,880].forEach((f,i)=>tone(f,.07,'square',.03,i*.05));hap('rigid')},
  click:()=>{if(quiet())return;tone(600,.03,'triangle',.04);hap('soft')},
  alarm:()=>{if(quiet())return;[392,370,392].forEach((f,i)=>tone(f,.1,'sawtooth',.025,i*.11));hap('warning')},
  reveal:()=>{if(quiet())return;[440,550,660].forEach((f,i)=>tone(f,.08,'sine',.05,i*.07));hap('rigid')},
  win:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.18,'sine',.08,i*.12));hap('success')},
  lose:()=>{[392,330,262].forEach((f,i)=>tone(f,.22,'triangle',.08,i*.15));hap('error')},
};
const goal=()=>table.goal;
try{Object.assign(cfg,JSON.parse(localStorage.getItem('duel-cfg'))||{})}catch(e){}
if(!GOALS.some(([g])=>g===cfg.goal))cfg.goal=600;   // порог пересчитан, старое сохранённое значение недостижимо
/* Настройки партии фиксируются в resetTable(): cfg — это выбор на СЛЕДУЮЩУЮ партию, и если
   читать его на лету, смена цели или соперника в меню меняла бы правила посреди игры. */
const tableFrom=o=>({goal:o.goal,diff:o.diff,start:o.start,draft:!!o.draft});
let table=tableFrom(cfg);
const saveCfg=()=>{try{localStorage.setItem('duel-cfg',JSON.stringify(cfg))}catch(e){}};
const PERKS=[
  {k:'rent',n:'Аренда',d:'Рента, которую платит соперник, попав на ваш квадрат.',
   val:l=>[0,11,20,32,45,62,80,99,120,143,169][l],
   fmt:l=>`рента ${[0,11,20,32,45,62,80,99,120,143,169][l]}`,
   cost:[25,40,60,85,115,155,200,255,320,400], unlock:()=>true},
  {k:'office',n:'Контора',d:'Прибавка к зарплате, которую вы получаете дома.',
   val:l=>20*l, fmt:l=>`зарплата ${BASE_SALARY+20*l}`,
   cost:[35,50,65,85,110,140,180,230,295,375], unlock:()=>true},
  {k:'shield',n:'Страховка',d:'Скидка на ренту, которую вы платите сопернику.',
   val:l=>6*l, fmt:l=>{const r=P[1]?Math.round(rentOf(P[1])*inflation()):0;
     return l?`на ${6*l}% меньше${r?`: ${Math.max(0,Math.round(r*(1-6*l/100)))} вместо ${r}`:''}`:`платите полную ренту${r?`: ${r}`:''}`},
   cost:[40,55,75,95,120,155,200,255,325,410], unlock:()=>true},
  {k:'route',n:'Логистика',d:'Бонус за возвращение домой с чужого квадрата.',
   val:l=>36*l, fmt:l=>l?`+${36*l} за возвращение`:'бонуса нет',
   cost:[45,60,80,105,135,175,225,285,360,450], unlock:p=>total(p)>=3},
  {k:'raid',n:'Рэкет',d:'Стоя в гостях, вы забираете часть ренты соперника обратно.',
   val:l=>12*l, fmt:l=>{const foe=P[1],r=foe?Math.round(rentOf(foe)*inflation()*.12*l):0;
     return l?`возвращаете ${12*l}% его ренты${r?`: ${r}`:''}`:'ничего не возвращаете'},
   cost:[50,70,90,115,150,190,240,300,375,470], unlock:p=>total(p)>=3},
];
const PK=PERKS.map(p=>p.k);
const total=p=>PK.reduce((s,k)=>s+p.lv[k],0);
const HOWTO={
  rent:'Срабатывает, когда соперник заканчивает ход на вашей клетке. Он платит ренту этого уровня, но вам достаётся только половина: вторая половина сгорает. Поэтому Аренда разоряет соперника быстрее всех, а копить деньги помогает плохо.',
  office:'Зарплата приходит каждый раз, когда ваш ход закончился дома, неважно, шагнули вы туда или остались. Уровень добавляет к базовым 60 фиксированную сумму. Это самый надёжный доход: он не зависит от соперника.',
  shield:'Уменьшает ренту, которую платите вы, оказавшись в гостях. Считается процентом от суммы уже с учётом инфляции. Чем выше Аренда у соперника, тем больше экономия, а против бедного соперника почти бесполезна.',
  route:'Начисляется только в тот ход, когда вы вернулись домой из гостей. Если вы просто остались дома, бонуса нет. Хорошо сочетается с Рывком: жетон гарантирует возвращение.',
  raid:'Пока вы стоите в гостях, вы забираете у соперника часть его же ренты. Считается процентом от неё, поэтому это прямой ответ тому, кто вложился только в Аренду: при высоких уровнях визит к нему перестаёт быть убыточным.',
};
const mk=(name,color,pos,bot)=>({name,color,pos,bot,money:table.start,built:false,seen:{},streak:0,ban:null,off:{},tok:{reroll:0,anchor:0,dash:0},tokBuys:{reroll:0,anchor:0,dash:0},cd:-99,force:null,st:{wage:0,got:0,paid:0,raid:0,route:0,away:0,home:0,sold:0,peak:0,bought:0,toks:0,tax:0,ones:0,zeros:0},lv:Object.fromEntries(PK.map(k=>[k,0]))});
let P=[],turn=0,over=false,busy=false,rounds=0,gen=0,logs=[],coin='—',msg='',acts=[],botPlan=[];
const STALE={};

   Монетка приходит с сервера отдельно и через него же становится честной. */
let rndS=1;

   выводится из них детерминированно. Одиночная игра идёт тем же слоем с локальным

let evLog=[],evPend=null,replaying=false,evCur=0,desync=false;
const net={mode:'local',send:null};
function evReset(){if(evPend){evPend.reject(STALE);evPend=null}evLog=[];evCur=0;desync=false}
function stateHash(){
  let h=7;
  const add=x=>{const t=String(x);for(let i=0;i<t.length;i++)h=(Math.imul(h,31)+t.charCodeAt(i))|0};
  add(turn);add(rounds);add(rndS);
  P.forEach(p=>{add(p.pos);add(p.money);add(p.streak);add(p.built?1:0);add(p.cd);add(p.force||'');add(p.ban||'');
    PK.forEach(k=>{add(p.lv[k]);add(p.off[k]?1:0)});TK.forEach(k=>{add(p.tok[k]);add(p.tokBuys[k])})});
  return h>>>0;
}
function onDesync(seq,mine,theirs){
  desync=true;
  console.warn('duel: расхождение на шаге',seq,'у меня',mine,'у отправителя',theirs);
  log('Внимание: состояние разошлось с соперником, партию лучше начать заново');
}
function evApply(ev){
  if(ev.seq!==evLog.length)return;
  evLog[ev.seq]=ev;
  if(evPend&&evPend.seq===ev.seq){const w=evPend;evPend=null;w.resolve(ev)}
}
function evEmit(ev){
  if(evLog[ev.seq])return;
  if(net.mode==='local'){
    if(ev.kind==='dice')ev.v=[1+rnd()*6|0,1+rnd()*6|0];
    evApply(ev);
  } else net.send({...ev,h:stateHash()});
}
/* Отпечаток сверяем в точке, где корутина дошла до шага, а не когда прилетел пакет:
   пакет может прийти, пока мы ещё доигрываем предыдущий ход. */
function evGet(seq){
  const g=gen;
  evCur=seq+1;
  const mine=MP&&!replaying&&!desync?stateHash():0;
  const chk=ev=>{if(mine&&typeof ev.h==='number'&&ev.h!==mine&&!desync)onDesync(seq,mine,ev.h);return ev};
  if(evLog[seq])return Promise.resolve(chk(evLog[seq]));
  if(replaying){replaying=false;render()}
  return new Promise((resolve,reject)=>{evPend={seq,resolve,reject}})
    .then(ev=>{if(g!==gen)throw STALE;return chk(ev)});
}
const TIMEOUT=75000,TIMEOUT_ABSENT=1500;
function evStall(seq,seat,fallback){
  if(net.mode==='local')return evGet(seq);
  const t0=Date.now();
  const iv=setInterval(()=>{
    if(evLog[seq])return;
    if(Date.now()-t0>=(mp.absent.has(seat)?TIMEOUT_ABSENT:TIMEOUT))fallback();
  },500);
  return evGet(seq).finally(()=>clearInterval(iv));
}
const canDrive=seat=>net.mode==='local'||P[seat].bot||seat===mySeat||mp.absent.has(seat);

async function evCoin(seat){
  const seq=evCur;
  if(canDrive(seat))evEmit({kind:'dice',seat,seq});
  return (await evStall(seq,seat,()=>evEmit({kind:'dice',seat,seq}))).v[0]%2;
}
/* def — что подставится по таймауту. По умолчанию это последняя кнопка, но там, где
   порядок кнопок задан смыслом, а не приоритетом, ответ за отошедшего передаётся явно. */
async function evAsk(seat,text,btns,def){
  const seq=evCur;
  if(def===undefined)def=btns[btns.length-1][1];
  if(seat===mySeat){
    msg=text;askText=text;

  } else {
    msg=`${P[seat].name} решает…`;acts=[];
    if(mp.absent.has(seat))evEmit({kind:'act',seat,seq,v:def});
  }

  const ev=await evStall(seq,seat,()=>evEmit({kind:'act',seat,seq,v:def}));

}

function showMoney(i,to){
  const el=$('money'+i);if(!el)return;
  if(shown[i]===undefined){shown[i]=to;el.textContent=to;return}
  const from=shown[i];
  if(from===to){el.textContent=to;return}
  shown[i]=to;
  if(typeof requestAnimationFrame!=='function'){el.textContent=to;return}
  if(tweens[i])cancelAnimationFrame(tweens[i]);
  const t0=performance.now(),dur=vis(520);
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*e);
    if(k<1)tweens[i]=requestAnimationFrame(step);else el.textContent=to;
  };
  tweens[i]=requestAnimationFrame(step);
}
const rectOf=p=>{const el=$(pawnId(p));return el?el.getBoundingClientRect():null};
function animateMove(p,before,stayed){
  const el=$(pawnId(p));if(!el||!el.animate)return;
  if(stayed){el.animate([{transform:'none'},{transform:'translateY(-12px) scale(1.08)'},{transform:'none'}],
    {duration:460,easing:'cubic-bezier(.3,1.3,.5,1)'});return}
  const now=el.getBoundingClientRect();
  if(!before)return;
  const dx=before.left-now.left,dy=before.top-now.top;
  if(!dx&&!dy)return;
  el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,-14px)',offset:.55},{transform:'none'}],
    {duration:620,easing:'cubic-bezier(.32,.9,.3,1)'});
}

/* Лог хранит голый текст, а имена красятся при выводе: цвет зависит от того, кто смотрит

   Текст сначала экранируется: в сетевой партии имя соперника — это ввод другого человека. */
const escHtml=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
function paintNames(html){
  const me=meP(),foe=foeP();
  if(!me||!foe||me.name===foe.name)return html;   // одинаковые имена не различить — лучше без цвета, чем неверно
  const cls={[escHtml(me.name)]:'a',[escHtml(foe.name)]:'b'};
  const alt=Object.keys(cls).sort((x,y)=>y.length-x.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  // границы слова через \p{L}: обычный \b не понимает кириллицу, и «Вы» совпало бы внутри «Выпало»
  return html.replace(new RegExp(`(?<![\\p{L}\\p{N}_])(${alt})(?![\\p{L}\\p{N}_])`,'gu'),n=>`<b class="pn ${cls[n]}">${n}</b>`);
}

function buy(p,k){
  if(!PK.includes(k)||!atHome(p)||!open(p,k)||p.built)return;
  const c=cost(p,k);if(c===null||p.money<c)return;
  p.money-=c;p.lv[k]++;p.built=true;p.st.bought++;
  if(p===meP())sfx.buy();else sfx.foeBuy();
  log(`${p.name}: ${perk(k).n} до ${p.lv[k]} уровня за ${c}, ${perk(k).fmt(p.lv[k])}`);
}
function autoSell(p){
  const owned=PK.filter(k=>p.lv[k]>0);
  if(!owned.length)return false;
  owned.sort((a,b)=>perk(b).cost[p.lv[b]-1]-perk(a).cost[p.lv[a]-1]);
  const k=owned[0];p.lv[k]--;const back=Math.round(perk(k).cost[p.lv[k]]/2);p.money+=back;
  p.st.sold++;log(`${p.name}: продан уровень «${perk(k).n}» за ${back}`);
  return true;
}
/* «Сдаться» стоит первой: по таймауту подставляется ПОСЛЕДНЯЯ кнопка, а ушедший
   игрок должен продолжать играть, а не автоматически сливать партию. */
async function askSale(p,need,owned){
  const btns=[['Сдаться',null,true]];
  owned.forEach(k=>{
    const back=Math.round(perk(k).cost[p.lv[k]-1]/2);
    btns.push([`${perk(k).n} ${p.lv[k]}→${p.lv[k]-1}: +${back}`,k,true]);
  });
  const v=await evAsk(p.id,`Нечем заплатить ${need}. На руках ${p.money}. Продайте уровень за полцены или сдайтесь.`,btns);
  return owned.includes(v)?v:null;
}
async function coverDebt(p,need){
  while(p.money<need){
    const owned=PK.filter(k=>p.lv[k]>0);
    if(!owned.length)return false;
    if(p.bot){if(!autoSell(p))return false;continue}
    const k=await askSale(p,need,owned);
    if(k===null){log(`${p.name}: партия сдана`);gaveUp=true;return false}
    p.lv[k]--;const back=Math.round(perk(k).cost[p.lv[k]]/2);p.money+=back;p.st.sold++;
    log(`${p.name}: продан уровень «${perk(k).n}» за ${back}`);
    render();
  }
  return true;
}
async function flip(p){
  const g=gen;busy=true;acts=[];note='';lastFlip=null;if(evCard){evCard.stale=true;evCard.deltas=null}render();
  const alive=()=>g===gen&&!over;
  let v;
  // значение просим сразу, анимация крутится параллельно — сетевая задержка прячется под ней
  const spin=async pr=>{
    for(let i=0;i<7;i++){coin=Math.random()<.5?'1':'0';render();sfx.tick();await sleep(60);if(!alive())throw STALE}
    return await pr;
  };
  let pre='';
  if(p.force){v=p.force==='stay'?0:1;coin=String(v);msg=`${p.name}: жетон вместо броска`;pre=`жетон «${p.force==='stay'?'Якорь':'Рывок'}»`;render();await sleep(500)}
  else{
    const pr=evCoin(p.id);pr.catch(()=>{});
    v=await spin(pr);coin=String(v);render();
    const away=P[v?1-p.pos:p.pos]!==p;
    if(p.tok.reroll>0&&away&&cdLeft(p)===0){
      let again;
      if(p.bot){again=true;await sleep(400)}
      else again=await evAsk(p.id,`Выпало ${v}, ${p===meP()?'вы попадёте':'игрок попадёт'} в гости. Перебросить? Жетонов: ${p.tok.reroll}`,
        [['Перебросить',true],['Оставить',false,true]]);
      if(!alive())return;
      if(again){
        p.tok.reroll--;p.st.toks++;p.cd=rounds;log(`${p.name}: переброс монетки`);sfx.token();
        const pr2=evCoin(p.id);pr2.catch(()=>{});
        v=await spin(pr2);coin=String(v);
      }
    }
  }
  p.force=null;
  /* Три хода подряд на одной клетке невозможны: на третий выносит принудительно.
     Это убирает мёртвые ходы и заодно задаёт потолок всему, что повышает шанс остаться. */
  let forced=false;
  if(v===0&&p.streak>=2){v=1;forced=true;coin='1'}
  if(v===1)p.st.ones++;else p.st.zeros++;
  const beforeRect=rectOf(p);
  const wasHome=atHome(p);
  if(v===1)sfx.go();else sfx.stay();
  if(forced)pre='третий ход на месте — переход';
  lastFlip={c:cls(p)};
  if(v===1){p.pos=1-p.pos;note='переход';
    msg=forced?`${p.name}: третий ход на месте — переход принудительно`:`${p.name}: выпала 1, шаг на соседнюю клетку`}
  else {msg=`${p.name}: выпал 0, остаётся на месте`;note='на месте'}
  render();animateMove(p,beforeRect,v===0);setTimeout(()=>{p.jump=false},280);await sleep(500);if(!alive())return;
  p.streak=(wasHome===atHome(p))?p.streak+1:1;
  if(atHome(p)){
    let gain=salary(p);let extra='';
    if(!wasHome&&val(p,'route')){gain+=val(p,'route');extra=`, Логистика +${val(p,'route')}`;p.st.route+=val(p,'route')}
    p.money+=gain;p.st.wage+=salary(p);p.st.home++;msg=`${p.name}: дома, +${gain} (зарплата ${salary(p)}${extra})`;log(msg);
    evCard={who:p.name,text:`дома: зарплата ${salary(p)}${extra}`,chips:[{t:`${p.name} +${gain}`,k:'pos'},...(pre?[{t:pre,k:'zero'}]:[])],
      deltas:{[p.id]:gain},tone:p===meP()?'good':''};
    if(p===meP())sfx.gain();
  } else {
    const foe=P[p.pos],r=payFor(p,foe);
    const keep=Math.round(r*RENT_KEEP);
    const raid=Math.round(rentOf(foe)*inflation()*.12*(p.off.raid?0:p.lv.raid));
    const take=Math.min(raid,foe.money+keep);
    const need=Math.max(0,r-take);
    if(!await coverDebt(p,need)){foe.money+=p.money;p.money=0;render();await sleep(600);return end(foe)}
    p.money+=take-r;foe.money+=keep-take;
    p.st.paid+=r;p.st.away++;foe.st.got+=keep;p.st.raid+=take;
    foe.st.peak=Math.max(foe.st.peak,r);
    /* В строке обе стороны: итог одного «−24» читался как угодно — чей он, гостя или хозяина. */
    const sg=v=>(v>=0?'+':'−')+Math.abs(v);
    const tally=`Итог: ${p.name} ${sg(take-r)}, ${foe.name} ${sg(keep-take)}`;
    msg=!r&&!take
      ?`${p.name}: в гостях, ренты нет, никто ничего не платит`
      :take
        ?`${p.name}: в гостях, рента ${r}, половина сгорает, Рэкет возвращает гостю ${take}. ${tally}`
        :`${p.name}: в гостях, рента ${r}, половина сгорает. ${tally}`;
    log(msg);
    {const chips=!r&&!take?[]:[{t:`${p.name} ${sgn(take-r)}`,k:take-r<0?'neg':take-r>0?'pos':'zero'},
        {t:`${foe.name} ${sgn(keep-take)}`,k:keep-take<0?'neg':keep-take>0?'pos':'zero'}];
      if(take)chips.push({t:`Рэкет +${take}`,k:'zero'});
      if(r-keep>0)chips.push({t:`сгорело ${r-keep}`,k:'zero'});
      if(pre)chips.push({t:pre,k:'zero'});
      const mine=p===meP()?take-r:foe===meP()?keep-take:0;
      evCard={who:p.name,text:!r&&!take?'в гостях: ренты нет':`в гостях: рента ${r}, половина сгорает`,chips,
        deltas:{[p.id]:take-r,[foe.id]:keep-take},tone:mine<0?'bad':mine>0?'good':''}}
    if(r||take){if(p===meP())sfx.pay();else if(foe===meP())sfx.gain()}
    if(foe.money<0&&!await coverDebt(foe,0))return end(p);
  }
  if(goal()&&capital(p)>=goal()){render();await sleep(400);return end(p,'capital')}
  render();await sleep(550);if(!alive())return;
  if(p.bot)botBuild(p);
  render();await sleep(350);
}
/* Продать перк по своей воле нельзя: продажа превращала вложенное в наличные, и игрок
   добирал порог победы распродажей в один ход. Продажа осталась только в долгах (coverDebt).
   Взамен перк можно выключить — это нужно против Рэкета: с 5-го его уровня соперник
   забирает с вашей ренты больше, чем достаётся вам, и Аренда начинает работать на него.
   Переключение не тратит действие хода и не меняет деньги. */
function togglePerk(p,k){
  if(!PK.includes(k)||p.lv[k]<1)return;
  p.off[k]=!p.off[k];
  log(`${p.name}: перк «${perk(k).n}» ${p.off[k]?'выключен':'снова включён'}`);sfx.click();
}
function useToken(p,k){
  if(!TK.includes(k)||p.tok[k]<1||cdLeft(p)>0)return false;
  if(k==='anchor'&&p.streak>=2)return false;   // третий ход на месте всё равно станет переходом
  p.tok[k]--;p.st.toks++;p.cd=rounds;p.force=k==='anchor'?'stay':'move';
  log(`${p.name}: применён жетон «${TOKENS[k].n}»`);sfx.token();
  return true;
}
function buyToken(p,k){
  if(!TK.includes(k))return;
  const t=TOKENS[k],price=tokPrice(p,k);
  if(p.built||p.money<price)return;
  p.money-=price;p.tok[k]++;p.tokBuys[k]++;p.built=true;
  if(p===meP())sfx.buy();else sfx.foeBuy();
  log(`${p.name}: куплен жетон «${t.n}» за ${price}${atHome(p)?'':' (в гостях, с наценкой)'}`);
}
/* «Акула» — линия, собранная из живых партий, а не из прогонов.
   Первые пять уровней Аренды окупаются, дальше кривая ломается; на чужой Рэкет
   отвечает Рэкетом; Контора приоритетнее Логистики, потому что платит на каждом
   ходе дома, а не только на возвращении. Купленную Аренду не продаёт никогда:
   вернуть половину вложенного хуже, чем терпеть урон от Рэкета. */
function sharkBuild(p){
  const foe=foeOf(p);
  // владельцу остаётся 50% ренты, Рэкет соперника забирает 12% за уровень: с 5-го уровня Аренда в минусе
  if(p.lv.rent>0&&!p.off.rent!==(foe.lv.raid<5||!!foe.off.raid))togglePerk(p,'rent');
  if(p.built||!atHome(p))return;
  const reserve=payFor(p,foe)+30;
  const can=k=>{const c=cost(p,k);return c!==null&&open(p,k)&&p.money-c>=reserve};
  if(foe.lv.rent>=2&&p.lv.raid<foe.lv.rent&&can('raid'))return buy(p,'raid');
  if(foe.lv.raid<2&&p.lv.rent<5&&can('rent'))return buy(p,'rent');
  if(can('office'))return buy(p,'office');
  // Логистика — догрузка к Конторе; если Контору закрыл драфт, она становится основной
  if((p.lv.office>=6||!open(p,'office'))&&can('route'))return buy(p,'route');
}
function botBuild(p){
  if(table.diff==='hard')return sharkBuild(p);
  if(p.built)return;
  if(!atHome(p)){
    if(p.tok.dash===0&&cdLeft(p)===0&&payFor(p,foeOf(p))>salary(p)&&p.money-tokPrice(p,'dash')>payFor(p,foeOf(p)))buyToken(p,'dash');
    return;
  }
  if(table.diff==='easy'&&rnd()<.35)return;
  const k=table.diff==='easy'?3.5:table.diff==='hard'?1:2;
  const reserve=Math.round(payFor(p,foeOf(p))*k)+(table.diff==='hard'?20:table.diff==='easy'?90:50);
  const can=botPlan.filter(k=>open(p,k)&&cost(p,k)!==null&&p.money-cost(p,k)>=reserve);
  const wantTok=table.diff==='hard'?.35:table.diff==='easy'?.1:.2;
  const tot=TK.reduce((s,k)=>s+p.tok[k],0);
  if(tot<3&&rnd()<wantTok){
    const k=payFor(p,foeOf(p))>salary(p)?'reroll':'anchor';
    if(p.money-tokPrice(p,k)>=reserve){buyToken(p,k);return}
  }
  if(can.length)buy(p,can[0]);
}
function botTokens(p){
  const danger=payFor(p,foeOf(p));
  if(cdLeft(p)===0&&atHome(p)&&p.streak<2&&p.tok.anchor>0&&danger>salary(p)*.8){p.tok.anchor--;p.st.toks++;p.cd=rounds;p.force='stay';log(`${p.name}: применён жетон «Якорь»`);sfx.token()}
  else if(cdLeft(p)===0&&!atHome(p)&&p.tok.dash>0){p.tok.dash--;p.st.toks++;p.cd=rounds;p.force='move';log(`${p.name}: применён жетон «Рывок»`);sfx.token()}
}
/* ---------- драфт ---------- */
/* Перед первым броском каждый закрывает сопернику один перк на всю партию. Это
   единственное, что отличает партии друг от друга ещё до начала: набор из четырёх
   перков у каждого свой, поэтому заученного дебюта не остаётся.
   Запреты выбираются по очереди, но применяются оба разом — пока второй не решил,
   первый бан не виден ни в перках, ни в логе. Иначе второй банил бы, зная ответ. */
function botBan(p){
  const r=rnd();
  if(table.diff==='easy')return PK[r*PK.length|0];
  if(table.diff==='normal')return r<.5?'rent':'office';
  return r<.6?'route':'office';   // Акула закрывает то, чем её чаще всего обыгрывают
}
async function draftPhase(){
  if(!table.draft)return;
  const bans=[];
  draftUI={chooser:0,pick:null};
  for(let i=0;i<2;i++){
    const p=P[i];
    draftUI.chooser=i;showDraft();
    /* botBan двигает ГПСЧ, поэтому вызывается ровно один раз и на всех клиентах
       одинаково — даже когда банит человек и значение уходит в запас. */
    const dflt=botBan(p);
    let k=dflt;
    if(!p.bot){
      tab='perks';
      const v=await evAsk(i,'Закройте сопернику один перк на всю партию. Ваш выбор он увидит, только когда решит сам.',
        PERKS.map(pk=>[pk.n,pk.k,false]),dflt);
      if(PK.includes(v))k=v;
    }
    if(over)return;
    bans[1-i]=k;   // банят сопернику, а не себе

  draftUI=null;$('ov').hidden=true;

  msg=`Драфт закрыт. ${P[0].name}: нет «${perk(bans[0]).n}». ${P[1].name}: нет «${perk(bans[1]).n}».`;

/* Главный цикл партии, одинаковый у всех клиентов. Всё, что нельзя вычислить —
   монетка и решения живых игроков, — приходит событиями в общем порядке. */
async function gameLoop(){
  try{
    await draftPhase();
    while(!over){
      const p=P[turn];
      if(p.bot){acts=[];idleCtx=null;busy=true;msg=`Ход ${p.name}`;render();await sleep(450)}
      else await idlePhase(p);
      if(over)return;
      await flip(p);
      if(over)return;
      turn=1-turn;P[turn].built=false;
      if(turn===0){
        rounds++;
        if(rounds%INFL_EVERY===0){
          log(`Инфляция: рента подорожала, теперь множитель ×${inflation().toFixed(1).replace('.',',')}`);
          sfx.alarm();inflFlash();await leaderTax();if(over)return;
        }
      }
      if(P[turn].bot)botTokens(P[turn]);
    }
  }catch(e){if(e!==STALE)throw e}
}
const runGame=()=>gameLoop().catch(e=>{if(e===STALE)return;console.error(e);msg='Ошибка партии, смотрите консоль';acts=[];render()});
/* Фаза до броска: игрок строит, продаёт, покупает жетон — и заканчивает её броском.
   Каждое действие едет отдельным событием, поэтому картина у обоих одинаковая. */
async function idlePhase(p){
  while(true){
    const seq=evCur;
    renderIdle(p,seq);
    if(p.id!==mySeat&&mp.absent.has(p.id))evEmit({kind:'act',seat:p.id,seq,v:{k:'roll'}});
    const ev=await evStall(seq,p.id,()=>evEmit({kind:'act',seat:p.id,seq,v:{k:'roll'}}));
    const a=ev.v;
    if(!a||typeof a!=='object'||typeof a.k!=='string')continue;
    if(a.k==='roll')return;
    if(a.k==='use'){if(useToken(p,a.key))return;continue}
    if(a.k==='buy')buy(p,a.key);
    else if(a.k==='toggle')togglePerk(p,a.key);
    else if(a.k==='tok')buyToken(p,a.key);
    render();
  }
}

function renderIdle(p,seq){
  busy=false;

    idleCtx=null;acts=[];msg=`Ход ${p.name}`;render();return;
  }
  const send=v=>{idleCtx=null;evEmit({kind:'act',seat:p.id,seq,v})};
  idleCtx={p,seq,send};
  msg=atHome(p)?(p.built?'Постройка в этом ходу уже сделана. Бросайте монетку.':'Вы дома: можно вложить деньги в один перк, потом бросайте монетку.')
    :(p.built?'Вы в гостях, действие хода уже потрачено. Бросайте монетку.':'Вы в гостях: перки строить нельзя, но жетон купить можно, он дороже на 50%.');

  render();
}

const loadQueue=()=>{try{return JSON.parse(localStorage.getItem(RKEY))||[]}catch(e){return[]}};
const saveQueue=q=>{try{localStorage.setItem(RKEY,JSON.stringify(q.slice(-20)))}catch(e){}};
const side=p=>({lv:{...p.lv},ban:p.ban,off:Object.keys(p.off).filter(k=>p.off[k]),st:{...p.st},bot:!!p.bot});
function recordResult(won,reason){
  if(!canRecord())return;
  const me=meP(),foe=foeP();
  saveQueue([...loadQueue(),{
    game:'duel',gid:MP?`${mp.code}-${gameSeed}`:`b${gameSeed}`,mode:MP?'pvp':'bot',diff:MP?null:table.diff,
    draft:table.draft,goal:table.goal,start:table.start,won,reason,rounds:rounds+1,seed:gameSeed,ver:'duel-2026-09-24',
    // журнал событий целиком: по нему партию можно переиграть и посчитать баланс на живых игроках
    data:{me:side(me),foe:side(foe),seat:mySeat,events:evLog},
  }]);
  flushResults();
}
let flushing=false;
async function flushResults(){
  if(flushing||!canRecord())return;
  flushing=true;
  try{
    let q=loadQueue();
    while(q.length){
      let r;
      try{r=await fetch(API_URL+'/result',{method:'POST',headers:{'content-type':'application/json','x-init-data':TG.initData},body:JSON.stringify(q[0])})}
      catch(e){break}                                   // нет сети — попробуем позже
      if(r.status>=500||r.status===429)break;           // сервер занят — тоже позже
      q=q.slice(1);saveQueue(q);                        // 2xx или ошибка формата: повторять бессмысленно
    }
  }finally{flushing=false}
}
async function showStats(){
  const head=`<div class="mhead"><div><h1>Моя статистика</h1><span>по вашему Telegram ID, имя не сохраняется</span></div>
    <button class="xbtn" id="statsBack" aria-label="Назад">${XICON}</button></div>`;
  openPage(head+'<p class="lead">Загружаю…</p>');$('statsBack').onclick=()=>showSetup();
  let s=null;
  try{const r=await fetch(API_URL+'/stats?game=duel',{headers:{'x-init-data':TG.initData}});if(r.ok)s=await r.json()}catch(e){}
  // 1 победа, 2 победы, 5 побед
  const pl=(n,one,few,many)=>{const a=n%10,b=n%100;return `${n} ${a===1&&b!==11?one:a>=2&&a<=4&&(b<12||b>14)?few:many}`};
  const pct=(w,g)=>g?Math.round(w/g*100)+'%':'';
  const row=(t,a,note='')=>`<div class="srow"><span>${t}</span><b>${a}${note?`<i>${note}</i>`:''}</b></div>`;
  const when=t=>new Date(t*1000).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  const why={capital:'по накоплениям',bankrupt:'банкротство',surrender:'сдача'};
  let body;
  if(!s)body='<p class="lead">Не удалось загрузить статистику. Проверьте связь и попробуйте ещё раз.</p>';
  else if(!s.games)body='<p class="lead">Здесь появятся ваши партии. Сыграйте первую — результат сохранится сам.</p>';
  else{
    const top=Object.entries(s.perkLevels||{}).filter(([k])=>perk(k)).sort((a,b)=>b[1]-a[1])[0];
    const st=s.streak;
    body=`<div class="sect"><div class="stats">
      ${row('партий',s.games)}${row('побед',s.wins,pct(s.wins,s.games))}
      ${Object.entries(DIFFS).map(([k,[n]])=>s.byDiff[k].games?row('против «'+n+'»',`${s.byDiff[k].wins} из ${s.byDiff[k].games}`,pct(s.byDiff[k].wins,s.byDiff[k].games)):'').join('')}
      ${s.byMode.pvp.games?row('с людьми',`${s.byMode.pvp.wins} из ${s.byMode.pvp.games}`,pct(s.byMode.pvp.wins,s.byMode.pvp.games)):''}
      ${st?row('текущая серия',st.won?pl(st.count,'победа','победы','побед'):pl(st.count,'поражение','поражения','поражений'),'подряд'):''}
      ${row('лучшая серия побед',s.bestWinStreak)}
      ${s.avgWinRounds?row('средняя победа','за '+pl(s.avgWinRounds,'круг','круга','кругов')):''}
      ${top?row('любимый перк',perk(top[0]).n):''}
    </div></div>
    <div class="sect"><b class="sttl">Последние партии</b><div class="stats">${s.recent.map(r=>row(`${when(r.at)} · ${r.mode==='pvp'?'с человеком':'«'+(DIFFS[r.diff]||['бот'])[0]+'»'}<br><small style="color:var(--dim)">${pl(r.rounds,'круг','круга','кругов')}${r.reason?', '+why[r.reason]:''}</small>`,r.won?'победа':'поражение')).join('')}</div></div>`;
  }
  openPage(head+body+'<button class="bline" id="statsBack2">Назад</button>');
  $('statsBack').onclick=$('statsBack2').onclick=()=>showSetup();
}
const mpSend=m=>{try{if(mp.ws&&mp.ws.readyState===1)mp.ws.send(JSON.stringify(m))}catch(e){}};
function mpConnect(code){
  mp.want=code||'';
  const prev=mp.ws;mp.ws=null;try{prev&&prev.close()}catch(e){}
  let ws;try{ws=new WebSocket(WS_URL)}catch(e){return mpFail('Не удалось открыть соединение.')}
  mp.ws=ws;net.mode='ws';net.send=ev=>mpSend({t:'intent',...ev});
  if(!MP)openPage('<div class="stack" style="gap:12px"><div class="logo"><i></i><i></i></div><h1>Подключаюсь…</h1><p class="lead">Ищу комнату на сервере.</p></div>');
  ws.onopen=()=>{
    mp.tries=0;
    mpSend({t:'hello',room:mp.want,uid:myUid(),name:myName(),color:cfg.color,initData:(inTG&&TG.initData)||''});
    if(MP)mpSend({t:'sync',have:evLog.length});
  };
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}mpMsg(m)};
  ws.onclose=()=>{
    if(mp.ws!==ws)return;
    mp.tries++;
    if(MP){msg='Связь потеряна, переподключаюсь…';render()}
    else if(mp.tries>3)return mpFail('Сервер комнат не отвечает.');
    setTimeout(()=>{if(mp.ws===ws)mpConnect(mp.want)},Math.min(8000,500*Math.pow(2,Math.min(4,mp.tries))));
  };
}
function mpFail(text){
  net.mode='local';
  openPage(`<div class="stack" style="gap:12px"><h1>Не получилось</h1><p class="lead">${escHtml(text)}</p></div>
    <button class="bgold" id="eBack">Играть с ботом</button>`);
  $('eBack').onclick=()=>showSetup();
}
function mpMsg(m){
  if(m.t==='lobby'){
    mp.code=m.code;mp.want=m.code;mp.members=m.members||[];mp.host=m.host;mp.you=m.you;mp.diff=m.diff;
    const mine=mp.members.find(x=>x.uid===mp.you);
    // цвет мог достаться не тот, что сохранён (занят) — интерфейс лобби красим выданным
    if(mine&&mine.color&&!MP)document.documentElement.style.setProperty('--you',mine.color);
    if(mine&&!mine.color){
      const taken=takenColors();
      const pick=taken.includes(cfg.color)?(COLORS.find(([c])=>!taken.includes(c))||[])[0]:cfg.color;
      if(pick)mpSend({t:'color',color:pick});
    }
    const typing=document.activeElement&&document.activeElement.id==='lName';
    if(!MP&&!mp.pending&&!typing)showLobby();
    return;
  }
  if(m.t==='presence'){mp.absent=new Set(m.absent||[]);return}
  if(m.t==='start'){mp.pending=m;return}
  if(m.t==='log'){mpRun(m.evs||[]);return}
  if(m.t==='ev'){if(MP&&m.ev)evApply(m.ev);return}
  if(m.t==='err'){mpFail(m.code==='full'?'В комнате уже двое.':m.code==='started'?'Партия уже идёт.':'Комната недоступна.');return}
}
/* Раздача мест и журнал приходят парой: пустой журнал — партия только началась,
   непустой — мы вернулись и его надо перемотать. */
function mpRun(evs){
  const m=mp.pending;if(!m)return;
  mp.pending=null;
  if(!Number.isInteger(m.you)||m.you<0)return mpFail('Ваше место за столом не найдено.');
  MP=true;mySeat=m.you;net.mode='ws';
  const seats=m.seats.slice(0,2).map(x=>({name:x.name,bot:x.bot}));
  while(seats.length<2)seats.push({name:'Бот',bot:true});
  /* Порог и стартовое золото приходят от хозяина: если считать их по своим настройкам,
     клиенты разойдутся на первом же ходу. */
  const o=m.opts||{};
  const t=tableFrom({
    goal:GOALS.some(([g])=>g===o.goal)?o.goal:cfg.goal,
    start:GOLD.some(([g])=>g===o.start)?o.start:cfg.start,
    diff:o.diff&&DIFFS[o.diff]?o.diff:cfg.diff,
    draft:typeof o.draft==='boolean'?o.draft:cfg.draft});
  /* Цвета — те, что игроки выбрали в лобби, одинаковые на обоих экранах. Если цвета нет
     (старый сервер) или он совпал с моим — соперник получает самый непохожий. */
  const sc=m.seats.slice(0,2).map(x=>x&&x.color);
  const youC=sc[mySeat]||cfg.color;
  let foeC=sc[1-mySeat];
  if(!foeC||foeC===youC)foeC=foeColor(youC)[0];
  mp.cols=[youC,foeC];
  resetTable(seats,m.seed,t);
  evLog=evs.slice();
  replaying=evLog.length>0;
  $('ov').hidden=true;
  if(!replaying)log(`Партия началась. У каждого по ${table.start}. Соперник: ${seats[1-mySeat].name}.`);
  runGame();
}
// цвета, занятые другими игроками комнаты: их выбрать нельзя
const takenColors=()=>mp.members.filter(x=>x.uid!==mp.you&&x.color).map(x=>x.color);
function showLobby(){
  const isHost=!!mp.you&&mp.host===mp.you;
  const webLink=location.origin+location.pathname+'?room='+mp.code;
  const link=inTG?tgLink(mp.code):webLink;
  const taken=takenColors(),mine=(mp.members.find(x=>x.uid===mp.you)||{}).color;
  const rows=mp.members.map(x=>`<div class="who2"><span class="sq" style="background:${x.color||'var(--line)'}"></span>
    <span class="ell">${escHtml(x.name)}</span><small>${[x.uid===mp.host?'хозяин':'',x.uid===mp.you?'вы':'',x.online?'':'отошёл'].filter(Boolean).join(' · ')}</small></div>`).join('');
  openPage(`<div class="mhead"><div><h1>Комната ${mp.code}</h1><span>Отправьте ссылку сопернику — он сядет за этот же стол.</span></div></div>
    <div class="sect">
      <div class="fld"><span>Ваше имя за столом</span><input class="inp" id="lName" type="text" maxlength="16" value="${escHtml(myName())}"></div>
      <div class="fld"><span>Цвет фишки — занятый соперником выбрать нельзя</span><div class="sws">${COLORS.map(([c,n])=>{
        const busy=taken.includes(c),who=busy?(mp.members.find(x=>x.color===c)||{}).name:'';
        return `<button class="sw" data-lcolor="${c}" style="background-color:${c}" aria-pressed="${mine===c}" ${busy?'disabled':''} title="${busy?`${n}: занят, ${escHtml(who)}`:n}" aria-label="${n}${busy?', занят':''}"></button>`}).join('')}</div></div>
    </div>
    <div class="stack">${inTG?'<button class="bgold" id="lShare">Позвать друга</button>':''}
      <div class="${inTG?'two':'stack'}"><button class="bline" id="lCopy">Скопировать ссылку</button>${inTG?'<button class="bline" id="lWeb">Для браузера</button>':''}</div></div>
    <div class="sect"><b class="sttl">За столом</b><div class="stack" style="gap:8px">${rows}</div></div>
    <div class="stack">${isHost?`<button class="bmain" id="lGo" ${mp.members.length<2?'disabled':''}>Начать партию</button>`:'<p class="note2">Ждём хозяина комнаты.</p>'}
      ${isHost&&mp.members.length<2?'<p class="note2">Нужен второй игрок — пришлите ему ссылку.</p>':''}
      <button class="bline" id="lExit">Выйти</button></div>`,'',!!$('lName'));
  $('lName').onchange=e=>setMyName(e.target.value);
  $('panel').querySelectorAll('[data-lcolor]').forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    cfg.color=b.dataset.lcolor;saveCfg();applyColor();mpSend({t:'color',color:cfg.color});
  });
  $('lName').onblur=e=>setMyName(e.target.value);
  $('lCopy').onclick=()=>{
    const done=()=>{$('lCopy').textContent='Скопировано'};
    try{navigator.clipboard.writeText(link).then(done,()=>prompt('Ссылка для соперника:',link))}
    catch(e){prompt('Ссылка для соперника:',link)}
  };
  if($('lWeb'))$('lWeb').onclick=()=>{
    try{navigator.clipboard.writeText(webLink).then(()=>{$('lWeb').textContent='Скопировано'},()=>prompt('Ссылка для браузера:',webLink))}
    catch(e){prompt('Ссылка для браузера:',webLink)}
  };
  if($('lShare'))$('lShare').onclick=()=>{
    const url=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Сыграем в «Два квадрата»?')}`;
    try{TG.openTelegramLink(url)}catch(e){prompt('Ссылка для соперника:',link)}
  };
  if($('lGo'))$('lGo').onclick=()=>{mpSend({t:'config',bots:0,opts:{goal:cfg.goal,start:cfg.start,diff:cfg.diff,draft:cfg.draft}});mpSend({t:'start'})};
  $('lExit').onclick=()=>{const w=mp.ws;mp.ws=null;try{w&&w.close()}catch(e){}net.mode='local';showSetup()};
}

initTG();
applyColor();
flushResults();
/* Приглашение приходит ссылкой ?room=CODE или диплинком startapp=CODE и ведёт прямо в комнату, мимо настроек. */
const joinCode=(()=>{
  const q=QS.get('room');if(q)return q;
  try{const sp=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param;if(sp)return String(sp)}catch(e){}
  return '';
})().toUpperCase().replace(/[^A-F0-9]/g,'').slice(0,6);
if(joinCode)mpConnect(joinCode);
else showSetup();
</script>
