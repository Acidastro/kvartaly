<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Кварталы — восьмёрка против ботов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EBE3; --board:#F7F8F4; --ink:#1F2A44; --muted:#6B7385; --line:#C9D1C4; --center:#EEF1EA; --hot:#E5484D; --objbg:#E8EEF8;
  /* игроки — насыщенные цвета, кварталы — приглушённые: иначе на мелкой клетке
     не отличить полоску группы от метки владельца */
  --p0:#2F5DFF; --p1:#D96A00; --p2:#0F8C6B; --p3:#8E2FA8;
  --g0:#A8825E; --g1:#3E93D6; --g2:#4FA84A; --g3:#E0A92E; --g4:#DE5E7E; --g5:#7B5FD0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A22; --board:#1E2530; --ink:#E7EAF0; --muted:#98A0B0; --line:#343D4B; --center:#192029; --hot:#FF6B6B; --objbg:#232D3C;
    --p0:#6F8CFF; --p1:#FF9A3C; --p2:#25C08A; --p3:#C86BE8;
    --g0:#C89A6E; --g1:#5FB4F2; --g2:#68CC62; --g3:#F2C452; --g4:#F2789A; --g5:#9B7BF0;
  }
}
:root[data-theme="dark"]{
  --bg:#151A22; --board:#1E2530; --ink:#E7EAF0; --muted:#98A0B0; --line:#343D4B; --center:#192029; --hot:#FF6B6B; --objbg:#232D3C;
  --p0:#6F8CFF; --p1:#FF9A3C; --p2:#25C08A; --p3:#C86BE8;
    --g0:#C89A6E; --g1:#5FB4F2; --g2:#68CC62; --g3:#F2C452; --g4:#F2789A; --g5:#9B7BF0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:var(--app-h,100dvh);-webkit-tap-highlight-color:transparent;
  /* на большом экране (Telegram Desktop) контент центрируем, иначе всё жмётся кверху */
  display:flex;flex-direction:column;justify-content:safe center}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--p0);outline-offset:2px}
.wrap{width:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top));
  padding-bottom:calc(16px + env(safe-area-inset-bottom))}
/* когда главное действие вынесено в MainButton Telegram — резервируем место снизу */
body.mb-on .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,.ot{font-family:Unbounded,Rubik,sans-serif;font-weight:700;letter-spacing:-.02em;margin:0}
.mut{color:var(--muted)}

.board{width:100%;aspect-ratio:7/5;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(5,1fr);gap:3px;background:var(--line);padding:3px;border-radius:14px}
@media (max-width:640px){.board{aspect-ratio:9/7}}
.cell{background:var(--board);position:relative;padding:3px 4px;display:flex;flex-direction:column;overflow:hidden;font-size:clamp(10px,1.5vw,13px);line-height:1.15;border:0;text-align:left;color:var(--ink);overflow-wrap:anywhere;hyphens:auto}
.cell.corner{background:var(--center)}
.cell.corner .nm{font-weight:600}
.cell.obj{background:var(--objbg)}
.cell .band{height:8px;margin:-3px -4px 4px;flex:none;box-shadow:inset 0 -1px 0 rgba(0,0,0,.3)}
@media (max-width:640px){.cell .band{height:6px;margin-bottom:3px}}
.cell .nm{font-weight:500;padding-right:11px}
.cell .ico{font-size:1.5em;line-height:1}
.cell .pr{color:var(--muted);margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:3px}
.cell.hotc .pr{color:var(--hot);font-weight:600}
.cell.mort .nm{text-decoration:line-through}
/* Владелец — угловой флажок, а не рамка: форма отличает его от полоски квартала,
   поэтому близкие оттенки игрока и группы больше не путаются. */
.cell .own{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 18px 18px 0;
  border-color:transparent var(--oc) transparent transparent;pointer-events:none;filter:drop-shadow(-1px 1px 1px rgba(0,0,0,.35))}
@media (max-width:640px){.cell .own{border-width:0 13px 13px 0}}
/* риск показываем полоской снизу, а не заливкой всей клетки — доска остаётся спокойной */
.cell .risk{position:absolute;left:0;right:0;bottom:0;background:var(--hot);opacity:.9;border-radius:2px 2px 0 0}
/* углы — узлы поля, им нужен свой знак */
.cell.corner .sign{position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:2.1em;line-height:1;opacity:.16;pointer-events:none}
/* уровни идут в строке с ценой, а не поверх названия — иначе на узком экране они наезжают на текст */
.cell .lv{display:flex;gap:2px;flex:none;align-items:center}
.cell .lv i{width:5px;height:5px;border-radius:50%;background:var(--ink)}
@media (max-width:640px){.cell .lv i{width:4px;height:4px}}
/* последний уровень — не ещё одна точка, а золотой ромб: его видно с любого расстояния */
.cell .lv.max b{display:block;width:10px;height:10px;border-radius:2px;transform:rotate(45deg);
  background:linear-gradient(135deg,#FFE28F,#E0A100);box-shadow:0 0 6px rgba(240,184,42,.8)}
@media (max-width:640px){.cell .lv.max b{width:8px;height:8px}}
.cell .rf{position:absolute;inset:3px;border:1px solid rgba(240,184,42,.55);border-radius:2px;pointer-events:none}
.cell.royal .nm{color:#F0B82A}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.dirb{position:absolute;left:3px;bottom:2px;font-size:1.35em;line-height:1;font-weight:700}
.tokens{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:2px;min-height:0}
/* фишки читаются на любой клетке: светлая обводка + тень отделяют их от фона и рамок */
.tok{width:clamp(10px,1.5vw,14px);height:clamp(10px,1.5vw,14px);border-radius:50%;
  border:2px solid rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.55)}
.tok.hop{animation:hop .14s ease-out}
.tk{display:flex;align-items:center;gap:1px}
.tarr{font-size:clamp(9px,1.35vw,14px);line-height:1;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5)}
/* своя фишка — крупнее и с двойным кольцом своего цвета */
.tok.me{width:clamp(14px,2.2vw,20px);height:clamp(14px,2.2vw,20px);
  box-shadow:0 0 0 2px var(--board),0 0 0 4px currentColor,0 1px 4px rgba(0,0,0,.6)}
.cell.here{box-shadow:inset 0 0 0 3px var(--p0)}
.cell.here.sel{box-shadow:inset 0 0 0 3px var(--p0),inset 0 0 0 5px var(--ink)}
.pulse{position:absolute;border-radius:50%;pointer-events:none;border:2px solid var(--p0);animation:pulse 1.6s ease-out infinite;width:clamp(13px,2.1vw,19px);height:clamp(13px,2.1vw,19px)}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:.5}}
@keyframes hop{50%{transform:translateY(-7px) scale(1.15)}}

.inner{background:var(--center);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;text-align:center;overflow:hidden}
.inner h1{font-size:clamp(13px,3vw,28px)}
.dice{display:flex;gap:8px}
.die{width:clamp(26px,5.5vw,50px);aspect-ratio:1;background:var(--board);border-radius:9px;display:grid;place-items:center;font-family:Unbounded,sans-serif;font-size:clamp(12px,2.6vw,22px);border:2px solid var(--line)}
.die.dbl{border-color:var(--ink)}
.status{font-size:clamp(9px,1.5vw,14px);max-width:34ch;overflow:auto}
.small-note{font-size:clamp(8px,1.2vw,12px)}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:40px;align-items:center}
/* блок решения: вопрос виден рядом с кнопками, обе кнопки равнозначны, MainButton в этот момент скрыта */
.bar.decide{display:block;background:var(--board);border:2px solid var(--p0);border-radius:14px;padding:12px 14px;text-align:center}
.bar.decide .q{font-size:15px;line-height:1.35;margin-bottom:10px}
.bar.decide .qbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--board);border:0;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn.small{padding:6px 12px;font-size:13px}

.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;align-items:start}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ptabs{display:none}
.sbar{display:none}
.tools select{background:var(--board);border:2px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px}
.pl{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pl .dot{width:14px;height:14px;border-radius:50%;margin-top:2px;flex:none}
.pmain{flex:1}
.prow{display:flex}
.prow .money{margin-left:auto;font-family:Unbounded,sans-serif;font-size:14px}
.hold{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap;align-items:center}
.grp{display:flex;gap:2px}
.grp i{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--line)}
.objs{display:flex;gap:1px;font-size:12px}
.objs span{opacity:.18}
.objs span.on{opacity:1}
.cardcount{font-size:12px}
.hold>span[title]{font-size:12px}
.pl.out{opacity:.35}
.pl.out .name{text-decoration:line-through}
.pl.cur .name{font-weight:600}
.info{background:var(--board);border-radius:12px;padding:12px;font-size:14px;min-height:60px;display:flex;flex-direction:column;gap:6px}
.info p{margin:0}
.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.fld select,.fld input{background:var(--center);border:2px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)}
.log{font-size:13px;color:var(--muted);max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:5px}
.log .le{display:flex;gap:7px;align-items:flex-start;line-height:1.3}
.log .le i{width:7px;height:7px;border-radius:50%;flex:none;margin-top:5px}
.log .le i.noone{background:var(--line)}
.log .le:first-child span{color:var(--ink)}
.log .le.loss span{color:var(--hot)}
.log .le.gain span{color:var(--p2)}
.mysum{font-size:clamp(9px,2.4vw,12px);color:var(--muted);line-height:1.25;max-width:14ch}
h2.sh{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}

.overlay{position:fixed;inset:0;background:rgba(15,20,30,.55);display:grid;place-items:center;padding:16px;z-index:10}
.overlay[hidden]{display:none}
.card{background:var(--board);border-radius:18px;padding:22px;width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.card .ot{font-size:24px}
.card p{margin:0}
.seg-wrap .lbl{font-size:13px;color:var(--muted);margin-bottom:5px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--board);border-color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px}
td .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
tr.out td{opacity:.5}
@media (prefers-reduced-motion: reduce){.tok.hop{animation:none}}

/* ---------- большой экран: Telegram Desktop и браузер ---------- */
@media (min-width:900px){
  .wrap{max-width:1180px;gap:18px}
  /* доска растёт до доступной высоты, сохраняя пропорции: ширина = высота × 7/5 */
  .board{width:min(100%,calc((var(--app-h,100dvh) - 330px) * 7 / 5));margin:0 auto}
  .pl,.info{font-size:15px}
  .log{font-size:14px;max-height:340px}
  h2.sh{font-size:14px}
  .btn{padding:11px 20px;font-size:15px}
}

/* ---------- мобильный режим / Telegram Mini App ---------- */
@media (max-width:640px){
  .wrap{padding-left:10px;padding-right:10px;gap:10px}
  .btn{min-height:44px;padding:10px 16px}
  .btn.small{min-height:36px;padding:7px 12px}
  .bar{min-height:0}
  .sbar{display:block;background:var(--board);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35}
  .sbar:empty{display:none}
  .money-big{font-family:Unbounded,sans-serif;font-size:clamp(14px,4vw,20px)}
  .ptabs{display:flex;gap:4px;background:var(--center);border-radius:999px;padding:4px}
  .ptabs button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:10px 4px;font-size:14px;font-weight:500}
  .ptabs button[aria-selected="true"]{background:var(--board);color:var(--ink);font-weight:600}
  .panels{grid-template-columns:1fr;gap:12px}
  .pane{display:none}
  .pane.on{display:block}
  .pane>h2.sh{display:none}
  .log{max-height:none}
  .tools{justify-content:center}
  .overlay{place-items:end center;padding:0}
  .card{border-radius:18px 18px 0 0;width:100%;max-height:85dvh;
    padding-bottom:calc(22px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="board" id="board"></div>
  <div class="sbar" id="sbar"></div>
  <div class="bar" id="acts"></div>
  <div class="ptabs" id="ptabs" role="tablist">
    <button role="tab" data-p="players" aria-selected="true">Игроки</button>
    <button role="tab" data-p="info" aria-selected="false">Клетка</button>
    <button role="tab" data-p="log" aria-selected="false">Ход игры</button>
  </div>
  <div class="panels">
    <div class="pane on" data-p="players"><h2 class="sh">Игроки</h2><div id="players"></div></div>
    <div class="pane" data-p="info"><h2 class="sh">Клетка</h2><div class="info" id="info"></div></div>
    <div class="pane" data-p="log"><h2 class="sh">Ход игры</h2><div class="log" id="log"></div></div>
  </div>
  <div class="tools">
    <select id="speedSel" aria-label="Скорость ботов">
      <option value="slow">Боты: медленно</option><option value="normal">Боты: обычно</option>
      <option value="fast">Боты: быстро</option><option value="instant">Боты: мгновенно</option>
    </select>
    <button class="btn ghost small" id="sndBtn"></button>
    <button class="btn ghost small" id="hapBtn" hidden></button>
    <button class="btn ghost small" id="newBtn">Новая игра</button>
  </div>
</div>
<div class="overlay" id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<script>
/* ---------- поле-восьмёрка ---------- */
/* Значения объектов по уровням — единый источник правды для описаний и для расчёта.
   Длина массива задаёт число уровней: у Мэрии их четыре, у остальных три. */
const OBJ_VALS={bank:[.08,.16,.32],market:[.15,.3,.5],hall:[2,4,8,10]};
// комиссия Банка: процент наличных, который платит каждый прошедший мимо, кроме владельца
const BANK_FEE=[.02,.03,.04];
const OBJ_DEF={
  bank:{icon:'',name:'Банк',price:180,desc:l=>`покупка улиц дешевле на ${Math.round(OBJ_VALS.bank[l]*100)}%, прошедшие мимо отдают вам ${Math.round(BANK_FEE[l]*100)}% своих наличных`},
  // Рынок держит бонус аренды за двоих: Депо с поля убрано, а без него объект почти не работал бы
  market:{icon:'',name:'Рынок',price:200,desc:l=>`+${Math.round(OBJ_VALS.market[l]*100)}% аренды на всех ваших улицах`},
  hall:{icon:'',name:'Мэрия',price:160,desc:l=>`+${OBJ_VALS.hall[l]} за каждую вашу улицу, когда вы входите в центр`},
};
const FEE=[15,30,50,70];
const BAIL=100;
const CARDS={
  free:{n:'Освобождение',d:'Выйти из тюрьмы бесплатно.'},
  repair:{n:'Ремонтная бригада',d:'Бесплатно поднять на уровень свою улицу или объект.',target:1},
  teleport:{n:'Телепорт',d:'Вместо броска переместиться на любую клетку и сыграть её.',target:1},
  shield:{n:'Щит',d:'Следующая аренда, сбор или налог для вас бесплатны.'},
  boost:{n:'Двойная аренда',d:'Следующая аренда или сбор, которые платят вам, удваиваются.'},
  extra:{n:'Лишний бросок',d:'Сразу бросить кубики ещё раз.'},
  discount:{n:'Скидка',d:'Следующая покупка или победа на аукционе дешевле на 30%.'},
};
const CARD_KEYS=Object.keys(CARDS);
const P=(name,price,g)=>({type:'prop',name,price,g});
const O=key=>({type:'obj',key,...OBJ_DEF[key]});
// путь восьмёркой: [ряд, колонка] для каждого шага. Поле 7×5, перешеек — колонка 3,
// его пять клеток (включая верхнюю и нижнюю) проходятся дважды за круг
const COORD=[[4,0],[3,0],[2,0],[1,0],[0,0],[0,1],[0,2],
  [0,3],[1,3],[2,3],[3,3],[4,3],
  [4,4],[4,5],[4,6],[3,6],[2,6],[1,6],[0,6],[0,5],[0,4],
  [0,3],[1,3],[2,3],[3,3],[4,3],
  [4,2],[4,1]];
const SPEC={
  0:{type:'start',name:'Старт'},1:P('Сад',60,0),2:P('Роща',80,0),3:P('Река',100,1),4:{type:'gojail',name:'Арест'},
  5:P('Мост',110,1),6:P('Форум',260,5),
  7:{type:'chance',name:'Шанс'},
  8:O('bank'),9:O('market'),10:O('hall'),
  11:{type:'tax',name:'Налог',amount:60},
  12:P('Торг',140,2),13:P('Склад',150,2),14:P('Порт',160,2),
  15:P('Театр',190,3),16:P('Опера',200,3),17:P('Музей',210,3),18:{type:'jail',name:'СИЗО'},
  19:P('Замок',220,4),20:P('Парк',240,4),
  26:P('Шпиль',300,5),27:P('Луг',70,0),
};
const CELLS=[],PATH=[];
{const seen={};COORD.forEach(([r,c],pi)=>{const k=r+','+c;if(seen[k]===undefined){seen[k]=CELLS.length;CELLS.push({...SPEC[pi],r,c,center:c===3})}PATH.push(seen[k])})}
const N=PATH.length,JAIL=18,CENTER_IN=[7,21];
const CASTLE=PATH.findIndex(i=>CELLS[i].name==='Замок');   // цель карточки «прогулка до Замка»
const PROPS=CELLS.map((_,i)=>i).filter(i=>CELLS[i].type==='prop');
const OBJS=CELLS.map((_,i)=>i).filter(i=>CELLS[i].type==='obj');
const OBJ_IDX=Object.fromEntries(OBJS.map(i=>[CELLS[i].key,i]));
const GROUPS=[0,1,2,3,4,5];
const GROUP=GROUPS.map(g=>`var(--g${g})`);
const GNAME=['Окраина','Река','Порт','Культурный','Парадный','Центр'];
const MULT=[1,3,6,10,15];   // уровни улиц: 0 — без улучшений, 4 — королевская прокачка

   ВАЖНО: mySeat запрещено использовать в правилах и в логике ботов — у разных клиентов

/* Детерминированный ГПСЧ (mulberry32): одна последовательность у всех клиентов,
   поэтому решения ботов и «Шанс» совпадают без пересылки по сети. Кубики — с сервера. */
let rndS=1;
function rnd(){rndS=rndS+0x6D2B79F5|0;let t=Math.imul(rndS^rndS>>>15,1|rndS);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

/* ---------- поток событий ---------- */
/* Партия — это последовательность событий двух видов: бросок кубиков и решение игрока.
   Всё остальное (ходы ботов, «Шанс», любые расчёты) выводится из них детерминированно,
   поэтому по сети едут только они. Одиночная игра идёт через тот же слой с локальным
   транспортом: код один на оба режима и не может разъехаться. */
let evLog=[],evPend=null,replaying=false;
/* evCur — на каком шаге партии находится ЭТОТ клиент. Брать номер из evLog.length нельзя:
   журнал приходит от сервера и легко убегает вперёд, пока мы доигрываем предыдущее
   событие, — тогда клиент перепрыгнул бы через шаг и разошёлся с остальными. */
let evCur=0;
const net={mode:'local',send:null};
function evReset(){if(evPend){evPend.reject(STALE);evPend=null}evLog=[];evCur=0;desync=false}
/* Отпечаток позиции. Отправитель кладёт его в событие, остальные сверяют со своим —
   так расхождение в правилах видно сразу, а не через двадцать ходов кривой партии. */
function stateHash(){
  let h=7;
  const add=s=>{const t=String(s);for(let i=0;i<t.length;i++)h=(Math.imul(h,31)+t.charCodeAt(i))|0};
  add(cur);add(round);add(rndS);
  players.forEach(p=>{add(p.pos);add(p.money);add(p.jail);add(p.alive?1:0);add(p.cards.join('.'));add(p.extra)});
  owner.forEach(add);level.forEach(add);mort.forEach(m=>add(m?1:0));
  return h>>>0;
}
let desync=false;
function evApply(ev){
  if(ev.seq!==evLog.length)return;   // порядок держит сервер; всё, что не следующим номером, — мусор
  evLog[ev.seq]=ev;
  if(evPend&&evPend.seq===ev.seq){const w=evPend;evPend=null;w.resolve(ev)}
}
function onDesync(seq,mine,theirs){
  desync=true;
  console.warn('kvartaly: расхождение на шаге',seq,'у меня',mine,'у отправителя',theirs);
  log('Внимание: состояние разошлось с соперником. Партию лучше начать заново.');
}
function evEmit(ev){
  if(evLog[ev.seq])return;           // на этот шаг событие уже есть — второй раз не шлём
  if(net.mode==='local'){
    if(ev.kind==='dice')ev.v=[1+rnd()*6|0,1+rnd()*6|0];
    evApply(ev);
  } else net.send({...ev,h:stateHash()});
}
/* Отпечаток считаем ровно здесь — в точке, где корутина дошла до шага seq. Сверять его
   в момент прихода сообщения нельзя: пакет может прилететь, пока мы ещё доигрываем
   предыдущий ход, и разойдётся не состояние, а момент замера. */
function evGet(seq){
  const g=gen;
  evCur=seq+1;
  const mine=MP&&!replaying&&!desync?stateHash():0;
  const chk=ev=>{
    if(mine&&typeof ev.h==='number'&&ev.h!==mine&&!desync)onDesync(seq,mine,ev.h);
    return ev;
  };
  if(evLog[seq])return Promise.resolve(chk(evLog[seq]));
  // журнал догнан — перемотка закончилась, возвращаемся к нормальной отрисовке
  if(replaying){replaying=false;render()}
  return new Promise((resolve,reject)=>{evPend={seq,resolve,reject}})
    .then(ev=>{if(g!==gen)throw STALE;return chk(ev)});
}
/* Ушедший игрок не должен вешать стол: по таймауту любой клиент подставляет вариант
   по умолчанию. Значение одно и то же у всех, сервер засчитает первого. Если сервер
   уже сказал, что человека нет на связи, ждать полный таймаут незачем. */
const TIMEOUT=75000,TIMEOUT_ABSENT=1500;
function evStall(seq,seat,fallback){
  if(net.mode==='local')return evGet(seq);
  /* Срок пересчитываем на каждом тике, а не один раз на входе: игрок может уйти уже
     после того, как мы начали его ждать, — тогда ждать полный таймаут незачем. */
  const t0=Date.now();
  const iv=setInterval(()=>{
    if(evLog[seq])return;
    if(Date.now()-t0>=(mp.absent.has(seat)?TIMEOUT_ABSENT:TIMEOUT))fallback();
  },500);
  return evGet(seq).finally(()=>clearInterval(iv));
}
// кубики просит хозяин места; за бота и за отсутствующего — любой клиент, сервер примет первого
const canDrive=seat=>net.mode==='local'||players[seat].bot||seat===mySeat||mp.absent.has(seat);
async function evDice(seat){
  const seq=evCur;
  if(canDrive(seat))evEmit({kind:'dice',seat,seq});
  return (await evStall(seq,seat,()=>evEmit({kind:'dice',seat,seq}))).v;
}
/* Решения с последствиями (продать, купить, поднять ставку) НИКОГДА не уезжают в MainButton:
   она под броском кубиков, и рука жмёт её не глядя. Такие вопросы показываем блоком
   с текстом и равнозначными кнопками — `flow: true` оставляют только продолжения хода.
   Последняя кнопка списка обязана быть отказом: именно она подставится по таймауту. */
async function evAsk(seat,text,btns,flow=false){
  const seq=evCur;
  const def=btns[btns.length-1][1];
  if(seat===mySeat){
    status=text;
    actions=btns.map(([l,val,gh])=>[l,()=>evEmit({kind:'act',seat,seq,v:val}),gh]);
    actions.flow=flow;actions.question=text;
  } else {
    status=`${players[seat].name} решает: ${text}`;actions=[];
    // за того, кого нет на связи, отказ подставляем сразу — стол не должен ждать пустое место
    if(mp.absent.has(seat))evEmit({kind:'act',seat,seq,v:def});
  }
  render();
  const ev=await evStall(seq,seat,()=>evEmit({kind:'act',seat,seq,v:def}));
  actions=[];
  return ev.v;
}
const VERB={платит:'платите',проходит:'проходите',покупает:'покупаете',закладывает:'закладываете',продаёт:'продаёте',
  выигрывает:'выигрываете',пасует:'пасуете',бросает:'бросаете',пропускает:'пропускаете',отправляется:'отправляетесь',

  доводит:'доводите',отказал:'отказали',отказался:'отказались'};
const CASES={'Сова':['Сове','Совой','Совы'],'Ёж':['Ежу','Ежом','Ежа'],'Кот':['Коту','Котом','Кота']};
/* Склонять умеем только имена ботов. За столом с живыми игроками их имена приходят
   из Telegram — такие оставляем как есть, поэтому список для регекспа собираем по столу. */
let NAMES_RE='Сова|Ёж|Кот';
function buildNameRe(){
  const ns=players.filter(p=>CASES[p.name]).map(p=>p.name);
  NAMES_RE=ns.length?ns.join('|'):'\\u0000';
}
function you(t){
  let s=String(t);
  if(/^Вы\s/.test(s))s=s.replace(/[А-Яа-яёЁ]+/g,w=>VERB[w]||w);
  s=s.replace(new RegExp('(плат[ия]т[еь]?|продаёт[е]?|заплатил[и]?|отказал[и]?) ('+NAMES_RE+')','g'),(m,v,n)=>v+' '+CASES[n][0]);
  s=s.replace(new RegExp('(?<= )Вы(?= (аренду|сбор|налог))','g'),'вам');
  s=s.replace(new RegExp('(плат[иея]т[еь]?|продаёт[е]?|заплатил[и]?) Вы','g'),(m,v)=>v+' вам');
  s=s.replace(new RegExp('лидирует Вы','g'),'лидируете вы');
  s=s.replace(new RegExp('([сС]) ('+NAMES_RE+')(?![А-Яа-яёЁ])','g'),(m,p,n)=>p+' '+CASES[n][1]);
  s=s.replace(new RegExp('([уУ]) ('+NAMES_RE+')(?![А-Яа-яёЁ])','g'),(m,p,n)=>p+' '+CASES[n][2]);
  s=s.replace(new RegExp('боту ('+NAMES_RE+')(?![А-Яа-яёЁ])','g'),(m,n)=>'боту '+CASES[n][0]);
  return s;
}

/* Названия клеток женского рода нужно склонять: «улучшает Рощу», а не «улучшает Роща».

function routeArrow(pos){
  const a=stepArrow(pos);
  if(!CELLS[cellAt(pos)].center)return a;
  let k=0;while(CELLS[cellAt((pos+k)%N)].center)k++;
  return stepArrow((pos+k-1+N)%N);
}
function stepArrow(pos){
  const a=CELLS[cellAt(pos)],b=CELLS[cellAt((pos+1)%N)];
  if(b.c>a.c)return '→';if(b.c<a.c)return '←';if(b.r>a.r)return '↓';return '↑';
}

/* ---------- звук ---------- */
let actx;
function tone(f,d=.08,type='sine',v=.07,delay=0){
  if(!settings.sound)return;
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime+delay;
    const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
// iOS не даёт стартовать AudioContext вне пользовательского жеста — будим его на первом тапе
function unlockAudio(){
  if(!settings.sound)return;
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}
}

function heatMap(){
  const heat={};const me=players[mySeat];
  if(!idle()||!me||!me.alive)return heat;
  for(let s=2;s<=12;s++){
    const i=cellAt((me.pos+s)%N),c=CELLS[i],pr=(6-Math.abs(s-7))/36;
    const bad=((c.type==='prop'||c.type==='obj')&&owner[i]>=0&&owner[i]!==mySeat&&!mort[i])||c.type==='tax'||c.type==='gojail';
    if(bad)heat[i]=(heat[i]||0)+pr;
  }
  return heat;
}
function renderCells(){
  if(replaying)return;
  const heat=heatMap();
  const mob=isMobile();   // на узкой клетке слово «сбор» не помещается рядом с точками уровней
  CELLS.forEach((c,i)=>{
    const el=$('c'+i);let h='';const o=owner[i]??-1;
    const royal=level[i]>0&&level[i]===maxLv(i);
    const lv=level[i]?(royal?'<span class="lv max"><b></b></span>':`<span class="lv">${'<i></i>'.repeat(level[i])}</span>`):'';
    if(c.type==='prop'){
      h+=`<div class="band" style="background:${GROUP[c.g]}"></div><div class="nm">${c.name}</div><div class="pr"><span>${o<0?c.price:mort[i]?'в залоге':(heat[i]?'−':'')+rentOf(i)}</span>${lv}</div>`;
    } else if(c.type==='obj'){
      h+=`<div class="nm">${c.name}</div><div class="pr"><span>${o<0?c.price:(heat[i]?'−':'')+(mob?'':'сбор ')+rentOf(i)}</span>${lv}</div>`;
    } else {
      const sub={start:'+200',chance:'',jail:`выкуп ${BAIL}`,gojail:'до 3 ходов',tax:`${c.amount}`}[c.type]||'';
      const sign={start:'▶',jail:'▦',gojail:'⇥',tax:'⊖',chance:'?'}[c.type]||'';
      h+=`${sign?`<span class="sign">${sign}</span>`:''}<div class="nm">${c.name}</div><div class="pr"><span>${sub}</span></div>`;
    }

    el.style.background=o>=0?`color-mix(in srgb, ${COLORS[o]} ${mort[i]?12:26}%, ${base})`:'';

    el.innerHTML=h;

    el.setAttribute('aria-label',c.name+(heat[i]?', опасная клетка':''));

/* В Telegram первое (главное) действие уезжает в нативную MainButton, остальные остаются в баре.

let mbFn=null;
function setMainButton(list){
  if(!inTG||!TG.MainButton)return list;
  const mb=TG.MainButton;
  if(mbFn){try{mb.offClick(mbFn)}catch(e){}mbFn=null}
  const main=list.flow===false?null:list.find(a=>!a[3]);
  if(!main||!$('overlay').hidden){try{mb.hide()}catch(e){}document.body.classList.remove('mb-on');return list}
  mbFn=()=>{hap('medium');main[1]()};
  try{mb.setText(String(main[0]).slice(0,64));mb.onClick(mbFn);mb.enable();mb.show()}catch(e){}
  document.body.classList.add('mb-on');
  return list.filter(a=>a!==main);
}

/* Лог читается по диагонали: точка игрока слева, а цветом отмечаем только СВОИ деньги —
   расчёты между ботами остаются нейтральными, иначе пестрит и смысл теряется. */
const LOG_MY_LOSS=/(платите|заплатили|гасите|закладываете|продаёте улучшение|выкупаете|разорились|банкрот)/i;
const LOG_MY_GAIN=/(получаете|покупаете|купили|выигрываете|улучшаете|доводите|проходите Старт)/i;
function logClass(m){
  if(/^Вы[ ,]/.test(m))return LOG_MY_LOSS.test(m)?'loss':LOG_MY_GAIN.test(m)?'gain':'';
  return /\bвам\b/i.test(m)?'gain':'';
}

    return `<div class="le ${logClass(m)}">${dot}<span>${m}</span></div>`;
  }).join('');
}

function showEnd(){

/* ---------- ход игры ---------- */
/* Стол собирается из списка мест: у каждого имя и признак «за него играет ИИ».
   В одиночной партии место одно — моё, остальные боты; в сетевой места раздаёт сервер. */
function resetTable(seats,seed,d){
  gen++;evReset();rndS=seed|0;diff=d;
  players=seats.map((s,i)=>({id:i,name:s.name,money:1500,pos:0,jail:0,alive:true,bot:!!s.bot,risk:RISK[i],
    cards:[],shield:false,boost:false,discount:false,extra:0,st:{rentIn:0,rentOut:0,bought:0}}));
  owner=CELLS.map(()=>-1);level=CELLS.map(()=>0);mort=CELLS.map(()=>false);cellRent=CELLS.map(()=>0);maxHit=null;
  cur=0;round=0;lastAsk={};botCool={};over=false;sel=-1;dice=[1,1];logs=[];
  pending=null;idleCtx=null;busy=false;tradeMsg='';
  buildNameRe();
}
function startGame(){
  MP=false;mySeat=0;net.mode='local';
  const seats=[{name:'Вы',bot:false},...Array.from({length:settings.bots},(_,i)=>({name:NAMES[i+1],bot:true}))];
  resetTable(seats,Math.random()*0x7FFFFFFF|0,settings.diff);
  guardClosing(true);hideOverlay();log('Игра началась. У каждого по 1500.');
  runGame();
}
function resume(s){
  MP=false;mySeat=0;net.mode='local';
  gen++;evReset();
  ({players,owner,level,mort,cellRent,maxHit,logs,cur,round,lastAsk,botCool,diff,dice}=s);
  rndS=s.rndS|0;
  over=false;sel=-1;pending=null;idleCtx=null;busy=false;tradeMsg='';
  buildNameRe();guardClosing(true);hideOverlay();log('Партия продолжена.');
  runGame();
}
// свернуть мини-апп посреди партии легко случайно — просим подтверждение
function guardClosing(on){
  if(!tgAtLeast('6.2'))return;
  try{on?TG.enableClosingConfirmation():TG.disableClosingConfirmation()}catch(e){}
}
/* Главный цикл партии. Один и тот же у всех клиентов: он детерминирован, а все развилки,
   которые нельзя вычислить, приходят событиями (кубики и решения живых игроков). */
// цикл живёт до конца партии; падение внутри него иначе утонуло бы в unhandled rejection
const runGame=()=>gameLoop().catch(e=>{if(e===STALE)return;console.error(e);status='Ошибка в ходе партии, см. консоль.';actions=[];render()});
async function gameLoop(){
  try{
    while(!over){
      if(gameEnded())return endGame();
      const p=players[cur];
      if(p.alive){
        if(p.bot){busy=true;actions=[];idleCtx=null;status=`Ходит ${p.name}.`;render();await wait(400);await turn(p)}
        else{
          const a=await idlePhase(p);
          if(a.k==='teleport')await doTeleport(p,a.i);
          else await turn(p);
        }
      }
      if(over)return;
      if(gameEnded())return endGame();
      advance();
    }
  }catch(e){if(e!==STALE)throw e}
}
function advance(){do{cur=(cur+1)%players.length;if(cur===0)round++}while(!players[cur].alive)}
/* Фаза до броска: игрок строит, закладывает, меняется — и заканчивает её броском.
   Каждое действие едет отдельным событием, поэтому у всех за столом одинаковая картина. */
async function idlePhase(p){
  while(true){
    const seq=evCur;
    renderIdle(p,seq);
    if(p.id!==mySeat&&mp.absent.has(p.id))evEmit({kind:'act',seat:p.id,seq,v:{k:'roll'}});
    const ev=await evStall(seq,p.id,()=>evEmit({kind:'act',seat:p.id,seq,v:{k:'roll'}}));
    const a=ev.v;
    if(a.k==='roll'||a.k==='teleport')return a;
    applyIdle(p,a);
  }
}
let idleCtx=null;   // {p,seq,send} — живёт ровно пока идёт моя фаза до броска
function renderIdle(p,seq){
  busy=false;
  if(p.id!==mySeat){
    idleCtx=null;actions=[];
    status=`Ходит ${p.name}${p.jail?', сидит в тюрьме':''}.`;
    render();return;
  }
  const send=v=>{idleCtx=null;evEmit({kind:'act',seat:p.id,seq,v})};
  idleCtx={p,seq,send};
  const me=players[mySeat];
  if(pending){
    status=`Карточка «${CARDS[pending].n}»: выберите клетку на поле.`;
    actions=[['Отменить карточку',()=>{pending=null;renderIdle(p,seq)},true]];
    save();render();return;
  }
  status='Ваш ход. Красным подсвечены клетки, где этим броском придётся платить.';
  const ups=owned(mySeat).filter(i=>canUpgrade(mySeat,i)&&me.money>=upCost(i));
  const cardBtns=[...new Set(me.cards)].filter(k=>k!=='free').map(k=>{
    const cnt=me.cards.filter(x=>x===k).length;
    return [`🃏 ${CARDS[k].n}${cnt>1?' ×'+cnt:''}`,()=>useCard(k),true];
  });
  actions=[['Бросить кубики',()=>send({k:'roll'})],
    ...ups.slice(0,4).map(i=>[`Улучшить ${label(i)}: ${upCost(i)}`,()=>send({k:'up',i}),true]),...cardBtns];
  save();render();
}
function useCard(k){
  if(!idleCtx)return;
  const me=players[mySeat];
  if(!me.cards.includes(k))return;
  if(CARDS[k].target){pending=k;renderIdle(idleCtx.p,idleCtx.seq);return}
  idleCtx.send({k:'card',key:k});
}
function applyPending(i){
  if(!idleCtx||!pending)return;
  const k=pending,me=players[mySeat];
  if(k==='repair'&&!canUpgrade(mySeat,i)){status='Эту клетку улучшить нельзя, выберите другую.';return render()}
  if(k==='teleport'&&PATH.findIndex((c,idx)=>c===i&&idx!==me.pos)<0){status='Сюда переместиться нельзя.';return render()}
  pending=null;
  idleCtx.send(k==='teleport'?{k:'teleport',i}:{k:'card',key:k,i});
}
function ownAction(a,i){
  if(!idleCtx||owner[i]!==mySeat)return;
  idleCtx.send({k:a,i});
}
/* Применение действия фазы. Выполняется на ВСЕХ клиентах одинаково, поэтому здесь
   не должно быть ни одной проверки, завязанной на mySeat, — только правила. */
function applyIdle(p,a){
  // значение приехало по сети — прежде чем считать по нему правила, проверяем форму
  if(!a||typeof a!=='object')return;
  const i=a.i;
  const okCell=x=>Number.isInteger(x)&&x>=0&&x<CELLS.length;
  if(a.k==='card'){if(CARDS[a.key]&&CARDS[a.key].target&&!okCell(i))return}
  else if(!okCell(i))return;
  if(a.k==='trade'&&!((a.j===-1||okCell(a.j))&&Number.isFinite(a.cash)))return;
  if(a.k==='up'&&owner[i]===p.id&&canUpgrade(p.id,i)&&p.money>=upCost(i)){
    p.money-=upCost(i);level[i]++;
    log(level[i]===maxLv(i)?`${p.name} доводит ${acc(i)} до королевского уровня`
      :`${p.name} улучшает ${label(i)} до уровня ${level[i]+(CELLS[i].type==='obj'?1:0)}`);sfx.buy();
  }
  else if(a.k==='sell'&&owner[i]===p.id&&level[i]&&CELLS[i].type==='prop'){
    level[i]--;p.money+=Math.round(upCost(i)/2);log(`${p.name} продаёт улучшение на ${prep(i)}`);
  }
  else if(a.k==='mort'&&owner[i]===p.id&&CELLS[i].type==='prop'&&!mort[i]&&groupClean(i)){
    mort[i]=true;p.money+=mortVal(i);log(`${p.name} закладывает ${acc(i)}`);
  }
  else if(a.k==='unmort'&&owner[i]===p.id&&mort[i]&&p.money>=unmortCost(i)){
    mort[i]=false;p.money-=unmortCost(i);log(`${p.name} выкупает ${acc(i)} из залога`);
  }
  else if(a.k==='card')applyCard(p,a.key,i);
  else if(a.k==='trade')applyTrade(p,i,a.j,a.cash);
  render();
}
function applyCard(p,key,i){
  const ci=p.cards.indexOf(key);if(ci<0)return;
  if(key==='repair'){
    if(!canUpgrade(p.id,i))return;
    p.cards.splice(ci,1);level[i]++;log(`${p.name} применяет «Ремонтную бригаду» на ${prep(i)}`);sfx.buy();return;
  }
  p.cards.splice(ci,1);
  if(key==='shield'){p.shield=true;log(`${p.name} применяет карточку «Щит»`)}
  else if(key==='boost'){p.boost=true;log(`${p.name} применяет карточку «Двойная аренда»`)}
  else if(key==='discount'){p.discount=true;log(`${p.name} применяет карточку «Скидка»`)}
  else if(key==='extra'){p.extra++;log(`${p.name} применяет карточку «Лишний бросок»`)}
}
async function doTeleport(p,i){
  if(!Number.isInteger(i)||i<0||i>=CELLS.length)return;
  const ci=p.cards.indexOf('teleport');if(ci<0)return;
  const target=PATH.findIndex((c,idx)=>c===i&&idx!==p.pos);
  if(target<0)return;
  p.cards.splice(ci,1);
  busy=true;actions=[];idleCtx=null;
  log(`${p.name} применяет «Телепорт» на ${prep(i)}`);
  p.pos=target;hop=p.id;render();await wait(400);hop=-1;
  await land(p);settleAll();render();await wait(400);
}
function payRent(p,i){
  const o=players[owner[i]];let r=rentOf(i);
  if(p.shield){p.shield=false;log(`${p.name} гасит платёж карточкой «Щит»`);return 0}
  if(o.boost){o.boost=false;r*=2;log(`${o.name} удваивает платёж карточкой «Двойная аренда»`)}
  p.money-=r;o.money+=r;o.st.rentIn+=r;p.st.rentOut+=r;cellRent[i]+=r;
  if(!maxHit||r>maxHit.a)maxHit={a:r,who:p.name,to:o.name,cell:CELLS[i].name};
  return r;
}
function settle(p){
  if(!p.alive||p.money>=0)return;
  while(p.money<0){
    const mine=owned(p.id);
    const upS=mine.filter(i=>CELLS[i].type==='prop'&&level[i]>0).sort((a,b)=>level[b]-level[a]);
    if(upS.length){const i=upS[0];p.money+=Math.round(upCost(i)/2);level[i]--;log(`${p.name} продаёт улучшение на ${prep(i)}`);continue}
    const upO=mine.filter(i=>CELLS[i].type==='obj'&&level[i]>0);
    if(upO.length){const i=upO[0];p.money+=Math.round(upCost(i)/2);level[i]--;log(`${p.name} понижает уровень: ${label(i)}`);continue}
    const m=mine.filter(i=>CELLS[i].type==='prop'&&!mort[i]).sort((a,b)=>CELLS[a].price-CELLS[b].price);
    if(m.length){const i=m[0];mort[i]=true;p.money+=mortVal(i);log(`${p.name} закладывает ${acc(i)}`);continue}
    const ob=mine.filter(i=>CELLS[i].type==='obj');
    if(ob.length){const i=ob[0];owner[i]=-1;p.money+=mortVal(i);log(`${p.name} продаёт банку ${acc(i)}`);continue}
    break;
  }
  if(p.money<0){
    p.alive=false;p.money=0;
    owned(p.id).forEach(i=>{owner[i]=-1;level[i]=0;mort[i]=false});
    log(`${p.name} — банкрот`);if(isMe(p.id))sfx.lose();
  }
}
const settleAll=()=>players.forEach(settle);
/* В сетевой партии моё банкротство её не заканчивает — остальные доигрывают, я смотрю.
   В одиночной смотреть не на что: без меня за столом одни боты. */
const gameEnded=()=>players.filter(p=>p.alive).length<=1||(!MP&&!players[mySeat].alive);

async function move(p,steps){
  const dir=Math.sign(steps);
  for(let s=0;s<Math.abs(steps);s++){
    p.pos=(p.pos+dir+N)%N;
    if(dir>0&&p.pos===0){p.money+=200;log(`${p.name} проходит Старт: +200`)}
    if(dir>0&&CENTER_IN.includes(p.pos)){
      const lv=objLv(p.id,'hall');
      if(lv>=0){const n=PROPS.filter(i=>owner[i]===p.id).length*OBJ_VALS.hall[lv];if(n){p.money+=n;log(`${p.name} получает ${n} от Мэрии`)}}
    }
    // обратный Старт: мимо чужого Банка нельзя пройти бесплатно
    if(dir>0){
      const bi=OBJ_IDX.bank,bo=owner[bi];
      if(cellAt(p.pos)===bi&&bo>=0&&bo!==p.id&&players[bo].alive){
        const n=Math.round(p.money*BANK_FEE[level[bi]]);
        if(n>0){
          p.money-=n;players[bo].money+=n;
          players[bo].st.rentIn+=n;p.st.rentOut+=n;cellRent[bi]+=n;
          // комиссия срабатывает дважды за круг у каждого — в лог пишем только то, что касается игрока
          if(p.id===0||bo===0)log(`${p.name} платит ${players[bo].name} комиссию ${n} за проход мимо Банка`);
        }
      }
    }
    hop=p.id;sfx.step();renderCells();renderPlayers();await wait(140);
  }
  hop=-1;
}
/* Значение кубиков приходит событием, а крутящаяся анимация рисуется локально:
   запрос уходит до анимации, поэтому сетевая задержка прячется под ней. */
async function rollDice(p,label){
  const pr=evDice(p.id);pr.catch(()=>{});
  for(let x=0;x<6;x++){dice=[1+Math.random()*6|0,1+Math.random()*6|0];status=label;sfx.roll();renderCenter();await wait(60)}
  dice=await pr;renderCenter();
  return dice[0]+dice[1];
}
async function jailTurn(p){
  const hasCard=p.cards.includes('free');
  let choice;
  if(p.bot){
    choice=hasCard?'card':(p.money>=BAIL+p.risk+200||p.jail===1&&p.money>=BAIL)?'pay':'roll';
    if(choice==='pay'&&p.money<BAIL)choice='roll';
    status=`${p.name} в тюрьме, попыток осталось ${p.jail}`;render();await wait(600);
  } else {
    // бросок стоит последним: по таймауту подставляется именно он, а не трата денег
    const btns=[];
    if(p.money>=BAIL)btns.push([`Заплатить ${BAIL} и выйти`,'pay',true]);
    if(hasCard)btns.push(['Карточка «Освобождение»','card',true]);
    btns.push(['Бросить на дубль','roll']);
    choice=await evAsk(p.id,`В тюрьме. Попыток выбросить дубль: ${p.jail}. Выкуп стоит ${BAIL}. На третьей неудаче выкуп спишется сам.`,btns,true);
  }
  if(choice==='card'){p.cards.splice(p.cards.indexOf('free'),1);p.jail=0;status=`${p.name} выходит из тюрьмы по карточке`;log(status);sfx.buy();render();await wait(500);return true}
  if(choice==='pay'){p.money-=BAIL;p.jail=0;status=`${p.name} платит выкуп ${BAIL} и выходит`;log(status);sfx.pay();render();await wait(500);return true}
  const steps=await rollDice(p,`${p.name} бросает на дубль`);
  if(dice[0]===dice[1]){p.jail=0;status=`${p.name} выбрасывает дубль ${dice[0]} и выходит из тюрьмы`;log(status);render();await wait(700);
    await move(p,steps);await land(p);return false}
  p.jail--;
  if(p.jail===0){p.money-=BAIL;status=`${p.name} отсидел три попытки, платит выкуп ${BAIL} и выходит`;log(status);sfx.pay();render();await wait(700);
    await move(p,steps);await land(p);return false}
  status=`${p.name} не выбросил дубль и остаётся в тюрьме, попыток ${p.jail}`;log(status);render();await wait(700);
  return false;
}
async function turn(p){
  if(over)return;
  busy=true;actions=[];idleCtx=null;tradeMsg='';
  if(p.jail>0){
    const out=await jailTurn(p);
    if(!out){settleAll();render();await wait(600);return}
  }
  let dbl=0;
  while(true){
    const steps=await rollDice(p,`${p.name} бросает кубики`);
    const isD=dice[0]===dice[1];if(isD)dbl++;
    if(dbl===3){p.pos=JAIL;p.jail=3;status=`${p.name}: третий дубль подряд, отправляется в тюрьму`;log(status);sfx.pay();render();await wait(800);break}
    status=`${p.name}: выпало ${steps}${isD?', дубль':''}`;renderCenter();
    await move(p,steps);
    await land(p);
    settleAll();render();
    if(!p.alive||gameEnded())break;
    if(p.extra>0&&!p.jail){p.extra--;status=`${p.name}: карточка «Лишний бросок»`;log(status);render();await wait(600);dbl=0;continue}
    if(!isD||p.jail)break;
    if(p.bot){status=`${p.name}: дубль, бросает ещё раз`;render();await wait(700)}
    else await evAsk(p.id,'Дубль! Бросайте ещё раз.',[['Бросить ещё раз',1]],true);
  }
  if(p.alive&&p.bot&&!gameEnded()){botUseCards(p);await botOffer(p);await botBotTrade(p);botManage(p);render()}
  await wait(p.bot?600:300);
}
function endGame(){
  over=true;busy=false;actions=[];idleCtx=null;clearSave();guardClosing(false);
  const alive=players.filter(p=>p.alive);
  const win=players[mySeat].alive&&alive.length<=1;
  log(win?'Победа! Соперники разорены.':players[mySeat].alive?`Партия окончена, победил ${alive[0]?alive[0].name:'никто'}.`:'Вы разорились.');
  if(win)sfx.win();render();showEnd();
}
async function land(p){
  const i=cellAt(p.pos),c=CELLS[i];
  if(c.type==='prop'||c.type==='obj'){
    const o=owner[i];
    if(o<0){
      let buy=false;
      const objBlocked=c.type==='obj'&&objOwned(p.id)>0;
      if(objBlocked){
        status=`${p.name}: объект уже есть в центре — ${label(i)} сразу уходит на аукцион`;log(status);render();await wait(600);
      }
      else if(p.bot)buy=botBuy(p,i);
      else if(p.money>=buyPrice(p.id,c.price)){
        setSel(i);
        const pr=buyPrice(p.id,c.price),disc=pr<c.price?` (Банк: вместо ${c.price})`:'';
        const txt=c.type==='obj'?`${label(i)} свободен. Купить за ${pr}${disc}? Даёт: ${c.desc(0)}. При отказе объект уйдёт на аукцион.`:`${c.name} свободна. Купить за ${pr}${disc}? При отказе улица уйдёт на аукцион.`;
        buy=await evAsk(p.id,txt,[['Купить за '+pr,true],['На аукцион',false]]);
      }
      if(buy){let cost=buyPrice(p.id,c.price);if(p.discount){p.discount=false;const ci=p.cards.indexOf('discount');if(ci>=0)p.cards.splice(ci,1);cost=Math.round(cost*.7);log(`${p.name} применяет карточку «Скидка»`)}p.money-=cost;owner[i]=p.id;p.st.bought++;status=`${p.name} покупает ${label(i)} за ${cost}`;log(status);sfx.buy();render();await wait(500)}
      else await auction(i,p);
    } else if(o!==p.id){
      if(mort[i]){status=`${c.name} в залоге, аренду не платят`;log(status)}
      else{const r=payRent(p,i);status=c.type==='obj'?`${p.name} платит ${players[o].name} сбор ${r} за ${label(i)}`:`${p.name} платит ${players[o].name} аренду ${r}`;log(status);sfx.pay()}
    } else status=`${p.name} на своей клетке: ${label(i)}`;
  } else if(c.type==='chance'){
    if(rnd()<.45){
      const k=pick(CARD_KEYS);p.cards.push(k);
      status=`${p.name} получает карточку «${CARDS[k].n}»`;log(status);sfx.chance();render();await wait(900);return render();
    }
    const card=pick(CHANCE);
    status=`${p.name}, Шанс: ${card.t}`;log(status);sfx.chance();render();await wait(900);
    await card.fn(p);
  } else if(c.type==='tax'){if(p.shield){p.shield=false;status=`${p.name} гасит налог карточкой «Щит»`}else{p.money-=c.amount;status=`${p.name} платит налог ${c.amount}`;sfx.pay()}log(status)}
  else if(c.type==='gojail'){p.pos=JAIL;p.jail=3;status=`${p.name} отправляется в тюрьму`;log(status);sfx.pay()}
  else status=`${p.name}: ${c.name}`;
  render();
}
async function auction(i,starter){
  const c=CELLS[i];
  // за объект торгуются только те, у кого своего объекта ещё нет
  const eligible=q=>c.type!=='obj'||objOwned(q.id)===0;
  const order=[];for(let s=0;s<players.length;s++){const q=players[(starter.id+s)%players.length];if(q.alive&&eligible(q))order.push(q)}
  const active=new Set(order.map(q=>q.id));
  let bid=0,high=null;
  const title=()=>`Аукцион: ${label(i)}, цена ${c.price}. ${high?`Ставка ${bid}, лидирует ${high.name}.`:'Ставок пока нет.'}`;
  log(`${label(i)} уходит на аукцион`);
  if(c.type==='obj'&&!order.some(q=>q.id===mySeat))log('Вы не участвуете: объект в центре у вас уже есть');
  setSel(i);status=title();render();await wait(500);
  while(active.size&&!(high&&active.size===1)){
    for(const q of order){
      if(!active.has(q.id)||q===high)continue;
      if(high&&active.size===1)break;
      const next=bid+10;let nb=0;
      if(q.money<next)nb=0;
      else if(q.bot){const mx=botMaxBid(q,i);if(next<=mx)nb=Math.min(mx,bid+pick([10,10,20,30]))}
      else nb=await evAsk(q.id,`${title()} Ставка:`,[[`${next}`,next],...(q.money>=bid+50?[[`${bid+50}`,bid+50,true]]:[]),...(q.money>=bid+100?[[`${bid+100}`,bid+100,true]]:[]),['Пас',0,true]]);
      if(nb>=next){bid=nb;high=q;status=title();sfx.step()}
      else{active.delete(q.id);status=`${q.name} пасует. ${title()}`}
      render();if(q.bot)await wait(400);
    }
  }
  if(high){let cost=buyPrice(high.id,bid);if(high.discount){high.discount=false;const ci=high.cards.indexOf('discount');if(ci>=0)high.cards.splice(ci,1);cost=Math.round(cost*.7);log(`${high.name} применяет карточку «Скидка»`)}high.money-=cost;owner[i]=high.id;high.st.bought++;status=`${high.name} выигрывает аукцион: ${label(i)} за ${cost}`;sfx.buy()}
  else status=`На ${label(i)} никто не поставил`;
  log(status);render();await wait(800);
}

/* ---------- боты ---------- */
/* Бот смотрит на «соперников вообще», а не на игрока с нулевым местом: в сетевой партии
   людей несколько, и любая привязка к mySeat развалила бы одинаковость расчёта. */
const rivalIn=(p,g)=>players.some(q=>q!==p&&q.alive&&countIn(q.id,g)>0);
const rivalNear=(p,g)=>players.some(q=>q!==p&&q.alive&&countIn(q.id,g)===gsize(g)-1);
function botBuy(p,i){
  const c=CELLS[i],left=p.money-buyPrice(p.id,c.price);
  if(left<0)return false;
  if(c.type==='obj'&&objOwned(p.id)>0)return false;
  if(D()<0)return rnd()<.6&&left>=30;
  if(c.type==='obj')return D()>0?left>=40:left>=p.risk*.6;
  if(countIn(p.id,c.g)>0&&left>=40)return true;
  if(D()>0&&rivalIn(p,c.g)&&left>=40)return true;
  return left>=p.risk;
}
function botMaxBid(p,i){
  const c=CELLS[i];
  let m=D()<0?.5+rnd()*.6:D()>0?1.05:.85;
  if(c.type==='obj')m+=Math.min(.4,.05*PROPS.filter(j=>owner[j]===p.id).length);
  else{m+=.45*countIn(p.id,c.g);if(rivalNear(p,c.g))m+=D()>0?.9:D()===0?.4:0}
  return Math.floor(Math.min(c.price*m,p.money-p.risk*.5)/10)*10;
}
function botWants(bot,i,buyer){
  const g=CELLS[i].g,sz=gsize(g),mine=countIn(bot.id,g);let need=1.4;
  if(mine===sz)need=3.2;else if(mine===sz-1&&sz>2)need=2.3;
  // живому сопернику отдавать опаснее, чем другому боту, — за такую улицу бот просит дороже
  if(countIn(buyer,g)===sz-1)need+=players[buyer].bot?.3:(D()>0?1.2:D()===0?.6:0);
  if(bot.money<150)need-=.5;
  if(D()<0)need-=.3;
  return need;
}
function giveValue(bot,i,buyer){
  const c=CELLS[i];let mult;
  if(c.type==='obj'){mult=1.8+.06*streetsOf(bot.id)+(D()>0?.3:D()<0?-.3:0);if(bot.money<150)mult-=.4}
  else mult=botWants(bot,i,buyer);
  return c.price*mult+level[i]*upVal(i)*(D()>0?1.5:1.25);
}
function gainValue(bot,j){
  const c=CELLS[j];
  const m=c.type==='obj'?1.1+.05*streetsOf(bot.id)+(D()<0?.3:0):botGain(bot,j);
  return c.price*m+level[j]*upVal(j);
}
function botGain(bot,j){const g=CELLS[j].g,n=countIn(bot.id,g);return(n===gsize(g)-1?2.4:1+.5*n)+(D()<0?.3:0)}
function offerTrade(i,j,cash){
  if(!idleCtx)return;
  const o=owner[i];if(o<0||o===mySeat)return;
  const bot=players[o],me=players[mySeat];
  if(cash>me.money){tradeMsg='У вас нет столько денег.';return render()}
  if(cash<0&&bot.money<-cash){tradeMsg=`У ${bot.name} нет ${-cash}.`;return render()}
  if(!tradeAllowed(mySeat,i,j)){tradeMsg=`У вас уже есть объект в центре — ${label(myObj(mySeat))}. Взять второй нельзя: отдайте свой объект в этой же сделке.`;return render()}
  if(!tradeAllowed(o,j,i)){tradeMsg=`У ${bot.name} уже есть объект в центре, второй он не возьмёт.`;return render()}
  idleCtx.send({k:'trade',i,j,cash});
}
/* Сделку считают все клиенты одинаково: бот сравнивает свою оценку отдаваемого с полученным.
   Меняться можно только с ботом — обмен между живыми игроками требует встречного
   согласия и отдельного протокола, в этой версии его нет. */
function applyTrade(p,i,j,cash){
  const o=owner[i];
  if(o<0||o===p.id||!players[o].alive||!players[o].bot||mort[i])return;
  const bot=players[o];
  if(cash>p.money||(cash<0&&bot.money<-cash))return;
  if(j>=0&&(owner[j]!==p.id||mort[j]))return;
  if(!tradeAllowed(p.id,i,j)||!tradeAllowed(o,j,i))return;
  const give=giveValue(bot,i,p.id);
  const gain=(j>=0?gainValue(bot,j):0)+cash;
  if(gain>=give){
    p.money-=cash;bot.money+=cash;owner[i]=p.id;if(j>=0)owner[j]=o;
    const price=[];if(j>=0)price.push(label(j));if(cash>0)price.push(String(cash));
    log(`${bot.name} продаёт ${p.name} ${acc(i)}${price.length?' за '+price.join(' и '):''}${cash<0?`, доплачивает ${-cash}`:''}`);
    if(isMe(p.id))tradeMsg='';
    sfx.buy();
  } else {
    lastAsk[i]=round;
    if(isMe(p.id))tradeMsg=gain>=give*.8?'Бот почти согласился, но хочет немного больше.':'Бот считает предложение слишком низким.';
    log(`${bot.name} отказался от сделки по ${label(i)}`);
  }
}
// бот торгуется с любым живым игроком, а не только с местом 0: за столом их может быть несколько
const humanOwner=i=>{const o=owner[i];return o>=0&&players[o].alive&&!players[o].bot?o:-1};
async function botOffer(p){
  if(streetsOf(p.id)>=4&&objOwned(p.id)===0){
    for(const i of OBJS){
      const t=humanOwner(i);
      if(t<0||mort[i])continue;
      const key='o'+i;if((botCool[key]??-9)>round-5)continue;
      const a=r10(CELLS[i].price*(1.6+.05*streetsOf(p.id))+level[i]*upVal(i)*1.2);
      if(p.money-a<p.risk+100)continue;
      botCool[key]=round;setSel(i);
      const yes=await evAsk(t,`${p.name} хочет купить у вас ${acc(i)}${level[i]?` с улучшениями`:''} за ${a}.`,[['Продать за '+a,true],['Оставить себе',false]]);
      if(yes){owner[i]=p.id;p.money-=a;players[t].money+=a;log(`${players[t].name} продаёт ${p.name} ${acc(i)} за ${a}`);sfx.buy()}
      else log(`${players[t].name} отказал ${p.name} в продаже ${label(i)}`);
      render();return;
    }
  }
  for(const i of PROPS){
    const t=humanOwner(i);
    if(t<0||!tradable(i))continue;
    const g=CELLS[i].g;
    if(countIn(p.id,g)!==gsize(g)-1)continue;
    if((botCool[i]??-9)>round-3)continue;
    const swap=PROPS.find(k=>owner[k]===p.id&&CELLS[k].g!==g&&tradable(k)&&countIn(t,CELLS[k].g)===gsize(CELLS[k].g)-1);
    let text,deal;
    if(swap!==undefined){text=`${p.name} предлагает обмен: ваша ${CELLS[i].name} на его ${CELLS[swap].name}. Кварталы соберёте оба.`;deal={k:swap,cash:0}}
    else{
      const a=r10(CELLS[i].price*(D()<0?2.2:D()>0?1.8:2)+level[i]*upVal(i)*1.2);
      if(p.money-a<p.risk)continue;
      text=`${p.name} хочет купить у вас ${CELLS[i].name}${level[i]?' с улучшениями':''} за ${a}. Это соберёт ему квартал.`;deal={k:-1,cash:a};
    }
    botCool[i]=round;setSel(i);
    const yes=await evAsk(t,text,[['Согласиться',true],['Отказать',false]]);
    if(yes){owner[i]=p.id;if(deal.k>=0)owner[deal.k]=t;p.money-=deal.cash;players[t].money+=deal.cash;log(`Сделка с ${p.name}: ${CELLS[i].name} уходит боту ${p.name}`);sfx.buy()}
    else log(`${players[t].name} отказал ${p.name} в сделке`);
    render();return;
  }
}
async function botBotTrade(p){
  if(streetsOf(p.id)>=4&&objOwned(p.id)===0){
    for(const i of OBJS){
      const o=owner[i];
      if(o<=0||o===p.id||!players[o].alive)continue;
      const q=players[o];if(streetsOf(q.id)>2)continue;
      const key='bo'+p.id+'-'+i;if((botCool[key]??-9)>round-4)continue;
      botCool[key]=round;
      const price=r10(giveValue(q,i,p.id));
      if(p.money-price<p.risk+80)continue;
      p.money-=price;q.money+=price;owner[i]=p.id;
      status=`${q.name} продаёт ${p.name} ${acc(i)} за ${price}`;log(status);sfx.buy();render();await wait(1000);return;
    }
  }
  for(const i of PROPS){
    const o=owner[i];
    if(o<=0||o===p.id||!players[o].alive||!tradable(i))continue;
    const q=players[o],c=CELLS[i],g=c.g;
    if(countIn(p.id,g)!==gsize(g)-1)continue;
    const key='b'+p.id+'-'+i;
    if((botCool[key]??-9)>round-2)continue;
    botCool[key]=round;
    const swap=PROPS.find(k=>owner[k]===p.id&&CELLS[k].g!==g&&tradable(k)&&countIn(q.id,CELLS[k].g)===gsize(CELLS[k].g)-1);
    if(swap!==undefined){
      owner[i]=p.id;owner[swap]=q.id;
      status=`${p.name} и ${q.name} меняются: ${c.name} на ${CELLS[swap].name}. Оба собрали кварталы.`;
    } else {
      const price=r10(giveValue(q,i,p.id));
      if(p.money-price<p.risk*.5){log(`${p.name} хотел купить ${c.name} у ${q.name}, но не хватило денег`);continue}
      p.money-=price;q.money+=price;owner[i]=p.id;
      status=`${q.name} продаёт ${p.name} ${acc(i)} за ${price}`;
    }
    log(status);sfx.buy();render();await wait(1000);return;
  }
}
function botUseCards(p){
  const take=k=>{const i=p.cards.indexOf(k);if(i<0)return false;p.cards.splice(i,1);log(`${p.name} применяет карточку «${CARDS[k].n}»`);return true};
  if(p.cards.includes('repair')){
    const opts=owned(p.id).filter(i=>canUpgrade(p.id,i));
    if(opts.length&&take('repair')){const i=opts[0];level[i]++;log(`${p.name} бесплатно улучшает ${acc(i)}`)}
  }
  if(p.cards.includes('boost')&&PROPS.filter(i=>owner[i]===p.id).length>=3&&rnd()<.6&&take('boost'))p.boost=true;
  if(p.cards.includes('shield')&&p.money<300&&take('shield'))p.shield=true;
  if(p.cards.includes('discount')&&p.money>=200)p.discount=true;
  if(p.cards.includes('extra')&&rnd()<.5&&take('extra'))p.extra++;
}
function botManage(p){
  let did=true;
  while(did){
    did=false;
    for(const i of PROPS.filter(i=>owner[i]===p.id&&mort[i]).sort((a,b)=>CELLS[b].price-CELLS[a].price)){
      if(p.money-unmortCost(i)>=p.risk+150){p.money-=unmortCost(i);mort[i]=false;log(`${p.name} выкупает ${acc(i)} из залога`);did=true;break}
    }
    if(did)continue;
    if(D()<0&&rnd()<.5)break;
    const reserve=D()>0?p.risk+60:p.risk+100;
    for(const i of PROPS.filter(i=>canUpgrade(p.id,i)).sort((a,b)=>level[a]-level[b])){
      if(p.money-upCost(i)>=reserve){p.money-=upCost(i);level[i]++;log(`${p.name} улучшает ${acc(i)}`);did=true;break}
    }
    if(did)continue;
    for(const i of OBJS.filter(i=>canUpgrade(p.id,i)).sort((a,b)=>level[a]-level[b])){
      if(p.money-upCost(i)>=reserve+80){p.money-=upCost(i);level[i]++;log(`${p.name} улучшает ${acc(i)} до уровня ${level[i]+1}`);did=true;break}
    }
  }
}

/* ---------- сетевая партия ---------- */
/* Сервер комнат живёт на своём домене — статика может лежать где угодно, хоть на Pages.
   Адрес переопределяется через ?ws=… , это нужно для проверки на локальной машине. */
const QS=new URLSearchParams(location.search);
const WS_URL=QS.get('ws')||'wss://telegramparser.duckdns.org/kvartaly';
const UIDKEY='kvartaly-uid';
function myUid(){
  let u=null;try{u=localStorage.getItem(UIDKEY)}catch(e){}
  if(!u){u=Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem(UIDKEY,u)}catch(e){}}
  return u;
}
function myName(){
  try{const u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;if(u&&u.first_name)return String(u.first_name).slice(0,24)}catch(e){}
  return 'Игрок';
}
const mpSend=m=>{try{if(mp.ws&&mp.ws.readyState===1)mp.ws.send(JSON.stringify(m))}catch(e){}};
function mpConnect(code){
  mp.want=code||'';
  const prev=mp.ws;mp.ws=null;try{prev&&prev.close()}catch(e){}
  let ws;
  try{ws=new WebSocket(WS_URL)}catch(e){return mpFail('Не удалось открыть соединение.')}
  mp.ws=ws;net.mode='ws';net.send=ev=>mpSend({t:'intent',...ev});
  if(!MP)overlay('<h2 class="ot">Подключаюсь…</h2><p class="mut">Ищу комнату на сервере.</p>',false);
  ws.onopen=()=>{
    mp.tries=0;
    mpSend({t:'hello',room:mp.want,uid:myUid(),name:myName(),initData:(inTG&&TG.initData)||''});
    if(MP)mpSend({t:'sync',have:evLog.length});   // вернулись в идущую партию — доберём пропущенное
  };
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}mpMsg(m)};
  ws.onclose=()=>{
    if(mp.ws!==ws)return;
    mp.tries++;
    if(MP){status='Связь потеряна, переподключаюсь…';render()}
    else if(mp.tries>3)return mpFail('Сервер комнат не отвечает.');
    setTimeout(()=>{if(mp.ws===ws)mpConnect(mp.want)},Math.min(8000,500*Math.pow(2,Math.min(4,mp.tries))));
  };
}
function mpFail(text){
  net.mode='local';
  overlay(`<h2 class="ot">Не получилось</h2><p>${text}</p>
    <div class="actions"><button class="btn" id="eNew">Играть с ботами</button></div>`,false);
  $('eNew').onclick=showSetup;
}
function mpMsg(m){
  if(m.t==='lobby'){
    mp.code=m.code;mp.want=m.code;mp.members=m.members||[];mp.host=m.host;mp.you=m.you;mp.bots=m.bots;mp.diff=m.diff;
    if(!MP&&!mp.pending)showLobby();
    return;
  }
  if(m.t==='presence'){mp.absent=new Set(m.absent||[]);return}
  if(m.t==='start'){mp.pending=m;return}          // саму партию запускаем, когда приедет журнал
  if(m.t==='log'){mpRun(m.evs||[]);return}
  if(m.t==='ev'){if(MP&&m.ev)evApply(m.ev);return}
  if(m.t==='err'){
    mpFail(m.code==='full'?'В комнате уже четверо.':m.code==='started'?'Партия в этой комнате уже идёт.':'Комната недоступна.');
    return;
  }
}
/* Старт партии и журнал приходят парой: сначала раздача мест, потом всё, что уже сыграно.
   Пустой журнал — значит партия только началась; непустой — мы вернулись и надо перемотать. */
function mpRun(evs){
  const m=mp.pending;if(!m)return;
  mp.pending=null;
  if(!Number.isInteger(m.you)||m.you<0)return mpFail('Ваше место за столом не найдено.');
  MP=true;mySeat=m.you;net.mode='ws';
  const seats=m.seats.map((s,i)=>({name:i===m.you?'Вы':s.name,bot:s.bot}));
  resetTable(seats,m.seed,m.diff);
  evLog=evs.slice();
  replaying=evLog.length>0;
  guardClosing(true);hideOverlay();
  if(!replaying)log(`Партия началась, за столом ${seats.length}. У каждого по 1500.`);
  runGame();
}
function mseg(lbl,key,opts,cur){
  return `<div class="seg-wrap"><div class="lbl">${lbl}</div><div class="seg">${opts.map(([v,t])=>
    `<button data-mk="${key}" data-mv="${v}" aria-pressed="${String(cur)===String(v)}">${t}</button>`).join('')}</div></div>`;
}
function showLobby(){
  const isHost=!!mp.you&&mp.host===mp.you;
  const free=Math.max(0,4-mp.members.length);
  const bots=Math.min(mp.bots,free);
  const total=mp.members.length+bots;
  const link=location.origin+location.pathname+'?room='+mp.code;
  const rows=mp.members.map((x,i)=>`<tr><td><span class="dot" style="background:${COLORS[i]}"></span>${x.name}${x.uid===mp.host?' · хозяин':''}${x.uid===mp.you?' · вы':''}</td><td>${x.online?'в комнате':'отошёл'}</td></tr>`).join('')
    +Array.from({length:bots},(_,i)=>`<tr><td><span class="dot" style="background:${COLORS[mp.members.length+i]}"></span>${['Сова','Ёж','Кот'][i]}</td><td>бот</td></tr>`).join('');
  overlay(`<h2 class="ot">Комната ${mp.code}</h2>
    <p class="mut">Отправьте ссылку друзьям — они сядут за этот же стол. Свободные места можно добить ботами.</p>
    <div class="actions"><button class="btn" id="lCopy">Скопировать ссылку</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>За столом</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    ${isHost?mseg('Добить ботами','bots',[[0,'без ботов'],[1,'1'],[2,'2'],[3,'3']],mp.bots):''}
    ${isHost?mseg('Сложность ботов','diff',[['easy','Лёгкие'],['normal','Обычные'],['hard','Сложные']],mp.diff):''}
    <div class="actions">
      ${isHost?`<button class="btn" id="lGo" ${total<2?'disabled':''}>Начать партию</button>`:'<span class="mut">Ждём хозяина комнаты.</span>'}
      <button class="btn ghost" id="lExit">Выйти</button></div>
    ${isHost&&total<2?'<p class="mut">Нужно хотя бы двое: позовите друга или добавьте бота.</p>':''}`,false);
  $('card').querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.mk;
    mpSend({t:'config',[k]:k==='bots'?+b.dataset.mv:b.dataset.mv});
  });
  $('lCopy').onclick=()=>{
    const done=()=>{$('lCopy').textContent='Ссылка скопирована';hap('success')};
    try{navigator.clipboard.writeText(link).then(done,()=>prompt('Ссылка для друга:',link))}
    catch(e){prompt('Ссылка для друга:',link)}
  };
  if($('lGo'))$('lGo').onclick=()=>mpSend({t:'start'});
  $('lExit').onclick=()=>{const w=mp.ws;mp.ws=null;try{w&&w.close()}catch(e){}net.mode='local';showSetup()};
}

/* ---------- Telegram: тема, высота, жесты ---------- */
function applyTheme(){
  if(!inTG)return;
  document.documentElement.dataset.theme=TG.colorScheme==='dark'?'dark':'light';
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if(tgAtLeast('6.9')&&/^#[0-9a-fA-F]{6}$/.test(bg)){
    try{TG.setHeaderColor(bg);TG.setBackgroundColor(bg)}catch(e){}
  }
}
function applyViewport(){
  if(!inTG)return;
  const h=TG.viewportStableHeight||TG.viewportHeight;
  if(h)document.documentElement.style.setProperty('--app-h',h+'px');
}
function initTG(){
  if(!inTG)return;
  try{TG.ready();TG.expand()}catch(e){}
  if(tgAtLeast('7.7'))try{TG.disableVerticalSwipes()}catch(e){}   // иначе свайп по доске сворачивает мини-апп
  applyTheme();applyViewport();
  try{
    TG.onEvent('themeChanged',()=>{applyTheme();render()});
    TG.onEvent('viewportChanged',applyViewport);
    TG.BackButton.onClick(()=>{if(overlayDismissible)hideOverlay()});
  }catch(e){}
}

/* ---------- запуск ---------- */
$('speedSel').onchange=e=>{settings.speed=e.target.value;savePrefs()};
$('sndBtn').onclick=()=>{settings.sound=!settings.sound;savePrefs();renderTools();if(settings.sound){unlockAudio();sfx.buy()}};
$('hapBtn').onclick=()=>{settings.haptic=!settings.haptic;savePrefs();renderTools();hap('medium')};
$('newBtn').onclick=showSetup;
$('ptabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{setPane(b.dataset.p);hap('soft')});
document.addEventListener('pointerdown',unlockAudio,{passive:true});
try{window.matchMedia('(max-width:640px)').addEventListener('change',()=>render())}catch(e){}

if(inTG)$('hapBtn').hidden=false;
try{localStorage.removeItem('kvartaly-eight-v1')}catch(e){}   // сохранёнки со старой геометрией поля
cloudDrop('kvartaly-eight-v1');
initTG();
buildBoard();setPane(pane);render();
/* Приглашение приходит двумя способами: ?room=CODE в обычной ссылке и startapp=CODE
   в диплинке Telegram. И то и другое ведёт сразу в комнату, минуя экран настроек. */
const joinCode=(()=>{
  const q=QS.get('room');if(q)return q;
  try{const sp=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param;if(sp)return String(sp)}catch(e){}
  return '';
})().toUpperCase().replace(/[^A-F0-9]/g,'').slice(0,6);
if(joinCode)mpConnect(joinCode);
else{
  showSetup();
  // облачная сохранёнка приходит асинхронно — если партия ещё не начата, перерисуем экран настроек
  cloudLoad(()=>{renderTools();if(!players.length&&!$('overlay').hidden)showSetup()});
}
</script>
